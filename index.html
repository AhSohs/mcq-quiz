<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#0f1218">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MCQ Practice</title>
<style>
:root{color-scheme:dark;--bg:#0f1218;--card:#1a1f29;--ink:#e6e9ef;--mute:#9aa3b2;--line:#323a4a;--acc:#4c6ef5;--ok:#51cf66;--okbg:rgba(81,207,102,.16);--bad:#ff6b6b;--badbg:rgba(255,107,107,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.q{font-weight:600;font-size:18px;white-space:pre-line;margin:0 0 16px}
.tag{line-height:1.3;display:inline-block;font-size:12px;font-weight:600;background:#3a2a14;color:#ffc078;border-radius:6px;padding:2px 8px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:14px;border:2px solid var(--line);border-radius:12px;background:#222834;color:var(--ink);font:inherit;cursor:pointer}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:#323a4a;display:grid;place-items:center;font-size:14px}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok b{background:var(--ok);color:#0f1218}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad b{background:var(--bad);color:#0f1218}
.opt:disabled{cursor:default}
.flash{text-align:center;font-size:22px;font-weight:700;color:var(--ok);margin-top:14px;min-height:30px}
.exp{margin-top:16px;padding:14px;border-radius:12px;background:#141922;border:1px solid var(--line);font-size:15.5px}
.exp p{margin:0 0 10px}.exp p:last-child{margin:0}
.exp .h{font-weight:700}.exp .g{color:var(--ok)}.exp .r{color:var(--bad)}
.next{margin-top:14px;width:100%;min-height:54px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:600 18px inherit;font-family:inherit;cursor:pointer}
.round{text-align:center;padding:30px 10px}
.round h2{margin:0 0 6px}
</style></head><body><div class="wrap">
<div class="top"><span id="prog"></span><span id="score"></span></div>
<div class="bar"><i id="barfill"></i></div>
<div class="card" id="card"></div>
</div>
<script>
const QS=[{"n": 1, "q": "Which statement describes bidirectional communications?", "o": ["Nodes connected at both ends can send or receive data but can't perform them at the same time.", "Nodes connected at both ends can send or receive data at the same time.", "Nodes connected at both ends can only send data one way at certain time interval.", "Nodes connected at both ends can only receive data."], "a": 1, "ex": ["This describes half-duplex: both directions are possible, but only one at a time.", "Bidirectional (full-duplex) communication lets both ends transmit and receive simultaneously.", "Data flowing only one way is simplex, not bidirectional.", "A node that can only receive is one-way (simplex) communication."]}, {"n": 2, "q": "In baseband transmission, the data bits are ___________ converted into signals.", "o": ["Converted to PCM waveforms before being", "Directly", "Low-pass filtered before being", "High-pass filtered before being"], "a": 1, "ex": ["PCM is a way to digitise analog signals; baseband simply sends the existing bits as signal levels without an extra conversion stage.", "Baseband sends the bits directly as signal levels on the medium, with no carrier modulation.", "Filtering is not the defining step; baseband means the bits are put directly onto the line.", "High-pass filtering would remove the low frequencies that baseband signals rely on."]}, {"n": 3, "q": "Which statement about NRZ-I is true?", "o": ["In NRZ-I, bit 1 represents a high voltage while bit 0 represents a low voltage.", "In NRZ-I, bit 1 represents a low voltage while bit 0 represents a high voltage.", "In NRZ-I, bit 1 represents a transition in voltage while bit 0 represents no transition.", "In NRZ-I, bit 1 represents a high to low voltage transition while bit 0 represents low to high voltage transition."], "a": 2, "ex": ["Mapping bits to fixed levels is NRZ-L, not NRZ-I.", "This is also a level-based scheme (inverted NRZ-L); NRZ-I encodes bits by transitions.", "NRZ-I (inverted): a 1 causes the level to flip; a 0 leaves it unchanged.", "Direction-specific transitions in mid-bit describe Manchester encoding, not NRZ-I."]}, {"n": 4, "q": "Select the statement that best describe the functions of a modem.", "o": ["A modem is a device that enables computers to communicate with another non-computer device", "A modem is a peripheral device that enables computers to communicate with each other over conventional telephone lines, ISDN cable lines, or even without wires.", "A modem is a peripheral device that enables computers to store IP addresses and node addresses.", "A modem is a device that enables computers to communicate with application servers and login servers."], "a": 1, "ex": ["A modem links computers to other computers/networks, not specifically to non-computer devices.", "A modem (modulator-demodulator) converts digital data to a form that travels over phone, cable/ISDN or wireless links so computers can talk to each other.", "Storing addresses is not a modem's job; that is for routers/hosts.", "Talking to specific server types is an application-level matter, not what defines a modem."]}, {"n": 5, "q": "A hardware modem consists of three components:", "o": ["Microcontroller unit, Data pump unit and Data access arrangement", "Microcontroller unit, Data storage unit and Data access arrangement", "Microcontroller unit, Data pump unit and Data assist arrangement", "Microcontroller unit, Data usage unit and Data access arrangement"], "a": 0, "ex": ["The three blocks are the MCU (control), the data pump (modulation/DSP) and the DAA (line interface).", "There is no 'data storage unit'; the middle block is the data pump.", "The line interface is the Data ACCESS Arrangement, not 'assist'.", "There is no 'data usage unit'; the middle block is the data pump."]}, {"n": 6, "q": "In a modem, what is the purpose of the Microcontroller unit?", "o": ["The microcontroller unit gets instruction and settings from ROM.", "The microcontroller unit serves as the hardware interface to the Public Switched Telephone System.", "The microcontroller unit checks data for errors and performs compression.", "The microcontroller unit modulates and demodulates incoming/outgoing data."], "a": 2, "ex": ["Reading firmware from ROM is incidental, not the MCU's purpose in the modem.", "The interface to the telephone network is the Data Access Arrangement (DAA), not the MCU.", "Per the doc, the MCU handles error checking and data compression (the data pump handles modulation).", "Modulation and demodulation is the job of the data pump, not the microcontroller."]}, {"n": 7, "src": "opts", "q": "Using the following lookup table for Huffman Coding, determine the coded sequence for \"DEAD\".\nA: 00\nB: 010\nC: 011\nD: 100\nE: 101\nF: 110\nG: 1110\nH: 11110\nI: 111110\nJ: 1111110\nK: 11111110\nL: 111111110", "o": ["10010100100", "10010110100", "10010001100", "00101100100"], "a": 0, "ex": ["D=100, E=101, A=00, D=100, giving 100 101 00 100.", "100 101 101 00 is D E E A: the E is repeated and the A comes last.", "100 100 01 100 doesn't decode cleanly: 100 = D, then 100 = D again, and 01 is not a code.", "00 101 100 100 decodes to A E D D, which is the wrong order."]}, {"n": 8, "q": "Translate the following binary number 111000 into decimal.", "o": ["56", "58", "63", "126"], "a": 0, "ex": ["111000 = 32 + 16 + 8 = 56.", "58 would be 111010.", "63 is 111111.", "126 is 1111110 (7 bits)."]}, {"n": 9, "q": "Translate the following decimal number 128 into binary.", "o": ["100000", "1000000", "10000000", "10000"], "a": 2, "ex": ["100000 = 32.", "1000000 = 64.", "128 = 2^7, so it's a 1 followed by seven 0s: 10000000.", "10000 = 16."]}, {"n": 10, "q": "Given an input signal of 10kHz input into a digital system, determine the sampling frequency for a successful reconstruction of the original system.", "o": ["5kHz", "7kHz", "10kHz", "22kHz"], "a": 3, "ex": ["5kHz is below 2 x 10kHz = 20kHz, so aliasing occurs.", "7kHz is below the 20kHz Nyquist rate.", "Sampling at the signal frequency (10kHz) is far below 20kHz and aliases.", "Nyquist needs fs > 2fm = 20kHz; 22kHz is the only option above that."]}, {"n": 11, "q": "Given an input signal of 15kHz into a digital system, determine the sampling frequency for a successful reconstruction of the original system.", "o": ["10kHz", "20kHz", "15kHz", "40kHz"], "a": 3, "ex": ["10kHz is below the 30kHz Nyquist rate.", "20kHz is below 2 x 15kHz = 30kHz.", "15kHz equals fm, well below 30kHz.", "Nyquist needs fs > 2fm = 30kHz; only 40kHz qualifies."]}, {"n": 12, "q": "Translate the following decimal number 67 into binary.", "o": ["1001111", "1110000", "1000011", "1100011"], "a": 2, "ex": ["1001111 = 64+8+4+2+1 = 79.", "1110000 = 64+32+16 = 112.", "67 = 64 + 2 + 1 = 1000011.", "1100011 = 64+32+2+1 = 99."]}, {"n": 13, "q": "Which statement about binary arithmetic is correct?", "o": ["Binary division will always result in a quotient and reminder", "Binary arithmetic does not have carry or borrow", "Binary subtraction will always need a borrow", "0x1=1"], "a": 0, "ex": ["Division gives a quotient and a remainder (the remainder may be 0). The other three statements are false.", "Binary arithmetic does use carries (1+1=10) and borrows (0-1).", "Many subtractions need no borrow, e.g. 1-0 = 1.", "Anything multiplied by 0 is 0, so 0x1 = 0."]}, {"n": 14, "q": "When plotted on a voltage vs. time graph, ___________ should produce a smooth and continuous curve.", "o": ["Analog signal", "Digital signal", "Analog & digital signal", "Modulated Digital signal"], "a": 0, "ex": ["Analog signals vary continuously, giving a smooth curve.", "Digital signals jump between discrete levels, giving a step/square shape.", "Only analog is smooth; digital is not.", "A modulated digital signal still carries abrupt (discrete) changes."]}, {"n": 15, "q": "Binary is a base number system.", "o": ["2", "4", "10", "16"], "a": 0, "ex": ["Binary uses two digits (0 and 1), so it is base 2.", "Base 4 is quaternary.", "Base 10 is decimal.", "Base 16 is hexadecimal."]}, {"n": 16, "q": "Decimal is a base number system.", "o": ["2", "4", "10", "16"], "a": 2, "ex": ["Base 2 is binary.", "Base 4 is quaternary.", "Decimal uses ten digits (0-9), so it is base 10.", "Base 16 is hexadecimal."]}, {"n": 17, "q": "In Data encryption standard(DES), there are 5 steps involved. The steps are shown below, determine the missing step.\nKey transformation -> Expansion permutation -> ___________ -> P-box permutation -> XOR and swap", "o": ["64-byte swap", "C-transpose", "S-box permutation", "And or swap"], "a": 2, "ex": ["There is no 64-byte swap in a DES round.", "'C-transpose' is not a DES step.", "After expansion and XOR with the round key, the 48 bits go through the S-boxes (substitution) before the P-box.", "'And or swap' is not a DES step; the round ends with XOR and swap."]}, {"n": 18, "q": "In expansion permutation, the left plain text(LPT) is expanded from 32 bits to ___________.", "o": ["64 bits", "64 bytes", "48 bits", "48 bytes"], "a": 2, "ex": ["64 bits is the full DES block, not the expanded half.", "DES works in bits; 64 bytes is far too large.", "The 32-bit half is expanded to 48 bits so it can be XORed with the 48-bit round key.", "Wrong unit; it's 48 bits, not bytes."]}, {"n": 19, "q": "Given a diagram with nodes A, B, C, D branching from a root node, determine the coded value for node B.", "o": ["00", "01", "10", "11"], "a": 1, "src": "hedged", "ex": ["00 is left-left, which would be node A.", "Per the doc: left branches are 0 and right are 1; B is reached left then right, giving 01.", "10 is right-left (node C in the usual layout).", "11 is right-right (node D in the usual layout)."]}, {"n": 20, "q": "JPEG is a ___________ image compression method", "o": ["Lossy", "Loss-less", "Compact less", "Compact ratio"], "a": 0, "ex": ["JPEG discards detail during quantization, so it is lossy.", "Standard JPEG is not lossless; formats like PNG are.", "'Compact less' is not a compression category.", "'Compact ratio' is not a compression category."]}, {"n": 21, "q": "In the step 2 of JPEG conversion, it uses which method to convert it to colours?", "o": ["R,G,B model", "Y,Cb,Cr model", "T,S,K model", "Y,B,G model"], "a": 1, "ex": ["The image starts out as RGB; step 2 converts it out of RGB.", "JPEG converts RGB to YCbCr (luminance plus blue and red chrominance), so colour detail can be compressed more than brightness.", "T,S,K is not a colour model.", "Y,B,G is not a standard colour model."]}, {"n": 22, "q": "Given the diagram showing a step-like signal with values +1V, +0.5V, -0.5V, -1V, determine the type of signal shown.", "o": ["Analog signal", "Digital signal", "Analog & digital signal", "Modulated Analog signal"], "a": 1, "ex": ["An analog signal varies smoothly, not in steps.", "A step-like signal taking only a few discrete levels is digital (here, 4 levels).", "It has only discrete levels, so it isn't analog as well.", "There is no carrier, so it isn't a modulated analog signal."]}, {"n": 23, "q": "Digital signatures follow ___________ encryption methodology to verify the authenticity of a document/file.", "o": ["Symmetric", "Asymmetric", "Standard", "Hash"], "a": 1, "ex": ["Symmetric keys are shared, so they can't prove which party signed.", "Digital signatures use a private key to sign and a public key to verify: asymmetric cryptography.", "'Standard' is not an encryption methodology.", "A hash of the document is what gets signed, but hashing isn't an encryption method and can't prove who signed."], "src": "corrected", "note": "Corrected: the photo caption said d), but the answer is b). The signer encrypts the document's hash with their private key, and anyone verifies it with the public key: asymmetric cryptography. A hash on its own can't prove who signed.", "cap": "d"}, {"n": 24, "src": "opts", "q": "Given the diagram showing a padlock combining \"Password123\" and a file to generate a hash \"D3%f@g43*1\", determine the type of function missing.", "o": ["Hash function", "Symmetric encryption function", "Asymmetric encryption function", "Encoding function"], "a": 0, "ex": ["A hash function turns the input (here the password plus the file) into a fixed-length digest like \"D3%f@g43*1\" that can't be reversed. The output is even called a hash.", "Symmetric encryption produces ciphertext that can be decrypted with the key; its output isn't a hash.", "Asymmetric encryption uses a public/private key pair and produces reversible ciphertext, not a hash digest.", "Encoding (e.g. Base64) is reversible and uses no key or one-way function."]}, {"n": 25, "q": "There are several ways to build a u-law expander, one of the method is ___________.", "o": ["Loop-up table", "Partial mathematical operation", "Linear approximation", "Partial differentiation"], "a": 2, "ex": ["Not the answer the doc gives for this question.", "'Partial mathematical operation' is not a recognised method.", "Per the doc: the u-law curve can be built with a piecewise linear approximation (segments).", "Differentiation is not used to build an expander."]}, {"n": 26, "q": "In the step 6 of Jpeg compression, the ___________ is applied to the DC component.", "o": ["Different pulse code modulation", "Differential digital code modulation", "Fourier transform", "Pulse code modulation"], "a": 0, "ex": ["Per the photo: the DC coefficients are coded differentially from block to block (DPCM, Differential Pulse Code Modulation, which this option abbreviates as 'Different').", "'Differential digital code modulation' isn't the technique; JPEG uses differential PULSE code modulation.", "JPEG uses the DCT on blocks, not a Fourier transform on the DC term.", "Plain PCM doesn't exploit the similarity of neighbouring DC values."]}, {"n": 27, "q": "In the step 5 of Jpeg compression, The zigzag scan is used to map the 8x8 matrix to a ___________ vector.", "o": ["8x4", "8x8", "2x64", "1x64"], "a": 3, "ex": ["8x4 holds only 32 values and isn't a vector.", "8x8 is the original matrix, not a vector.", "2x64 would hold 128 values.", "Zigzag reads all 64 coefficients into a single 1x64 vector."]}, {"n": 28, "q": "Given the diagram, determine the type of modulating scheme.\n(Diagram: (a) data 1 0 0 1 1 0 1 0 1; (b) a carrier whose phase flips each time the data changes between 1 and 0.)", "o": ["BPSK", "QPSK", "AM-SC", "DPSK"], "a": 0, "ex": ["Each bit value has a fixed phase (0 or 180 degrees), so the phase flips whenever the data changes: BPSK.", "QPSK uses four phases, two bits per symbol.", "AM-SC varies amplitude, not phase.", "In DPSK the phase change depends on each bit relative to the previous symbol (e.g. shift on every '1'), not on the data changing state."], "src": "corrected", "note": "Corrected: the photo caption said d), but the answer is a). In the diagram the carrier phase flips exactly where the data changes between 1 and 0, so each bit value has its own fixed phase: BPSK. The original doc also said BPSK.", "cap": "d"}, {"n": 29, "q": "What is insertion loss in an eye diagram?", "o": ["A frequency dependent loss of signal power that is dependent on channel length and material properties.", "An amplitude dependent loss of signal power that is dependent on channel length and material properties.", "A phase dependent loss of signal power that is dependent on channel length and material properties.", "A time dependent loss of signal power that is dependent on channel length and material properties."], "a": 0, "ex": ["Insertion loss rises with frequency (skin effect, dielectric loss) and with channel length, closing the eye.", "Insertion loss doesn't depend on signal amplitude.", "Insertion loss isn't defined by phase.", "Insertion loss is characterised over frequency, not time."]}, {"n": 30, "q": "One of the steps in SHA-256 algorithm is described as: \"The entire message gets broken down into multiple blocks of 512 bits each. It puts each block through 64 rounds of operation, with the output of each block serving as the input for the following block.\" Select the step described.", "o": ["Padding bits", "Initializing the buffers", "Compression function", "Output"], "a": 2, "ex": ["Padding only extends the message to the right length.", "Initializing sets the starting hash values (H0-H7).", "The compression function processes each 512-bit block through 64 rounds, chaining outputs.", "Output is the final 256-bit digest after all blocks."]}, {"n": 31, "q": "Translate the following binary number 111111 into decimal.", "o": ["64", "58", "63", "126"], "a": 2, "ex": ["64 is 1000000.", "58 is 111010.", "111111 = 32+16+8+4+2+1 = 63.", "126 is 1111110."]}, {"n": 32, "q": "Data encryption standard uses ___________ key length to process the data block.", "o": ["64 byte", "56 bits", "64 bits", "56 bytes"], "a": 1, "ex": ["DES keys are measured in bits, not bytes.", "DES has an effective 56-bit key (64 bits supplied, 8 used for parity).", "64 bits is the supplied key size including parity; the effective key length is 56 bits.", "56 bytes (448 bits) is far longer than the DES key."], "src": "corrected", "note": "Corrected: the photo caption said d), but the answer is b). DES uses a 56-bit key (64 bits supplied, 8 of them parity). 56 bytes would be 448 bits.", "cap": "d"}, {"n": 33, "q": "4 digital systems have a measured BER of certain value. Select the best system among them.", "o": ["Digital system A BER=0.001%", "Digital system B BER=0.000001%", "Digital system C BER=100%", "Digital system D BER=10000%"], "a": 1, "ex": ["0.001% is 1000 times worse than system B.", "Lowest bit error rate means the fewest errors, so B is best.", "100% means every bit is wrong.", "BER can't exceed 100%; this value is meaningless."]}, {"n": 34, "q": "What is the function of initial permutation?", "o": ["The Initial permutation (IP) happens only once and it happens before the first round. It suggests how the transposition in IP should proceed.", "The Initial permutation (IP) happens after left plain text. It suggests how the transposition in IP should proceed.", "The Initial permutation (IP) happens after left plain text. It suggests how many bit/byte the key length should have.", "The Initial permutation (IP) happens only once and it happens before the first round. It suggests how the S-box permutation should proceed."], "a": 0, "ex": ["IP is applied once to the 64-bit block before round 1, and its table defines how the bits are transposed.", "IP comes before the block is split into left/right plaintext, not after.", "IP doesn't come after the LPT, and it doesn't set the key length.", "IP doesn't control the S-boxes; those are fixed substitution tables used inside each round."]}, {"n": 35, "src": "check", "q": "In eye diagram, which point is the best time to sample (decision point)?", "o": ["At the centre of the eye opening, where the vertical opening is largest", "At the zero crossings, where the traces cross", "At the edge of the eye, at the start of each bit period", "At the point of maximum overshoot above the eye"], "a": 0, "note": "Photo version: the diagram labels four points A-D, and the answer is C, the centre of the eye opening between the two crossings. The original doc's 'point B' was wrong; the location is the same as this answer.", "ex": ["The middle of the eye has the largest vertical opening (best noise margin) and is furthest from the transitions (best timing margin).", "At the zero crossings the signal is changing between levels, and jitter is greatest there.", "The edge of the eye is where the transitions happen, so the margin there is smallest.", "Overshoot is distortion outside the eye; sampling there gives no better decision."]}, {"n": 36, "q": "Determine the binary arithmetic: 1/0", "o": ["0", "1", "10", "Not allowed"], "a": 3, "ex": ["Division by zero has no value.", "Division by zero is undefined, not 1.", "10 (=2) is not a result of division by zero.", "Division by zero is undefined in binary just as in decimal."]}, {"n": 37, "q": "Determine the binary arithmetic: 0/0", "o": ["0", "1", "10", "Not allowed"], "a": 3, "ex": ["0/0 is undefined, not 0.", "0/0 is undefined, not 1.", "10 is not a result of 0/0.", "Division by zero, including 0/0, is undefined."]}, {"n": 38, "q": "Determine the binary arithmetic: 0+0+1", "o": ["0", "1", "10", "Not allowed"], "a": 1, "ex": ["0 ignores the +1.", "0 + 0 + 1 = 1.", "10 (=2) would be 1+1.", "Addition is always allowed."]}, {"n": 39, "q": "Given the diagram, determine the type of modulating scheme.\n(Diagram: data 0 0 1 1 0 1 0 0 0 1 0; the carrier's phase is reversed at each bit that is 1 and unchanged at each 0.)", "o": ["BPSK", "QPSK", "AM-SC", "DPSK"], "a": 3, "ex": ["In BPSK each bit value has a fixed phase, so it would follow the 0/1 level rather than flipping on every 1.", "QPSK uses four phases, two bits per symbol.", "AM-SC changes amplitude, not phase.", "Reversing the phase relative to the previous symbol on each 1 (and leaving it on a 0) is Differential PSK."]}, {"n": 40, "q": "The following modulation scheme is described as: \"It is a Suppressed Carrier DSBSC modulation scheme, which sends two bits of digital information at a time, called as digits.\", determine the type of modulator described.", "o": ["BPSK", "QPSK", "AM-SC", "DPSK"], "a": 1, "ex": ["BPSK sends one bit per symbol.", "QPSK sends two bits (a 'dibit') per symbol using four phases.", "AM-SC is analog amplitude modulation, not a two-bit digital scheme.", "DPSK sends one bit per symbol, encoded differentially."]}, {"n": 41, "q": "A digital signal is a signal that represents data as a sequence of discrete values. A digital signal can only take on one value from a ___________ set of possible values at a given time.", "o": ["Finite", "Infinite", "Distinct", "Indistinct"], "a": 0, "ex": ["A digital signal picks from a limited (finite) set of levels.", "An infinite set of values describes analog signals.", "The values are distinct, but the key property asked for is that the set is finite.", "Indistinct values contradict the idea of discrete levels."]}, {"n": 42, "q": "Determine the binary arithmetic: 1x1", "o": ["0", "1", "10", "Not allowed"], "a": 1, "ex": ["0 would be a product involving 0.", "1 x 1 = 1.", "10 (=2) is 1+1, not 1x1.", "Multiplication is always allowed."]}, {"n": 43, "q": "Determine the binary arithmetic: 1+1", "o": ["0", "1", "10", "Not allowed"], "a": 2, "ex": ["0 is only the sum bit; you'd lose the carry.", "1 is wrong; 1+1 = 2.", "1 + 1 = 2, which is 10 in binary (sum 0, carry 1).", "Addition is always allowed."]}, {"n": 44, "q": "Determine the binary arithmetic: (1+1)-1", "o": ["0", "1", "10", "Not allowed"], "a": 1, "ex": ["10 - 1 = 1, not 0.", "(1+1) = 10, and 10 - 1 = 1.", "10 is the value before subtracting 1.", "Subtraction is allowed here."]}, {"n": 45, "q": "One of the data-link control protocol is described as: \"This flow control mechanism forces the sender after transmitting a data frame to stop and wait until the acknowledgement of the data-frame sent is received.\", determine the type of flow control that is described.", "o": ["Stop and wait ARQ", "Go-back N ARQ", "Selective Repeat ARQ", "Stop and release ARQ"], "a": 0, "ex": ["Send one frame, then stop and wait for its ACK: Stop-and-Wait ARQ.", "Go-Back-N sends a window of frames without waiting for each ACK.", "Selective Repeat also sends a window and resends only the frames that failed.", "'Stop and release ARQ' is not a real protocol."]}, {"n": 46, "q": "Which statement about ideal eye diagram is correct?", "o": ["The eye diagram's eye opening will be nearly circularly.", "The eye diagram is narrow and low.", "The eye diagram's eye opening will be nearly square.", "The eye diagram is narrow and high."], "a": 2, "ex": ["A circular or rounded opening indicates bandwidth limits or ISI, not an ideal channel.", "Narrow and low means a closed eye: bad timing and noise margin.", "With no noise, jitter or ISI, the transitions are sharp, so the eye opening is wide, tall and nearly square.", "A narrow eye means little timing margin (jitter), so it is not ideal."]}, {"n": 47, "q": "What are some of the basic information that could be contained in an eye diagram?", "o": ["Time variation of zero crossing.", "Amount of variation between bits.", "Noise figure at sampling points.", "Amount of jitter in receivers."], "a": 0, "ex": ["The spread of the zero crossings (timing variation) is a standard reading from an eye diagram.", "'Variation between bits' is not a standard eye-diagram measure.", "An eye diagram shows the noise margin, not the noise figure (an amplifier spec).", "The eye shows jitter in the received signal, not a property of the receivers themselves."]}, {"n": 48, "q": "The input of a signal is given; determine the Nyquist frequency needed to successfully reconstruct the original signal.\n(Diagram: sine wave with a period of 0.02 s.)", "o": ["50hz", "75hz", "100hz", "25hz"], "a": 2, "ex": ["50 Hz is the signal frequency itself (1/0.02 s); sampling must be at least twice that.", "75 Hz is less than 2 x 50 Hz.", "f = 1/0.02 s = 50 Hz, so the Nyquist rate is 2 x 50 = 100 Hz.", "25 Hz is below even the signal frequency."]}, {"n": 49, "q": "After the Initial permutation (IP) is done, the resulting permuted text is divided into ___________ blocks.", "o": ["2", "3", "4", "5"], "a": 0, "ex": ["The 64-bit permuted block is split into two 32-bit halves (LPT and RPT).", "DES splits into halves, not thirds.", "Not four; DES uses two 32-bit halves.", "Not five; DES uses two 32-bit halves."]}, {"n": 50, "q": "The following modulation scheme is described as: \"The phase of the modulated signal is shifted relative to the previous signal element. No reference signal is considered here. The signal phase follows the high or low state of the previous element.\", determine the type of modulator described.", "o": ["BPSK", "QPSK", "AM-SC", "DPSK"], "a": 3, "ex": ["BPSK uses absolute phases against a reference carrier.", "QPSK uses absolute phases for 2-bit symbols.", "AM-SC is amplitude modulation.", "Phase changes relative to the previous element, with no reference, is Differential PSK."]}, {"n": 51, "q": "Select the statement that best the purpose of MSME equalizer.", "o": ["It approximates the inverse of the channel with a linear filter.", "It designs the filter to minimize E[|e|^2], where e is the error signal that is the filter output minus the transmitted signal.", "It processes the incoming signal with a linear filter.", "It augments a linear equalizer by adding a filtered version of previous symbol estimates to the original filter output filter."], "a": 1, "ex": ["Approximating the channel inverse is the zero-forcing equalizer.", "MMSE ('MSME' in the doc) means Minimum Mean Square Error: choose the filter that minimises E[|e|^2].", "This describes a generic linear equalizer.", "Feeding back past symbol decisions is a decision-feedback equalizer (DFE)."]}, {"n": 52, "q": "Select the statement that best the purpose of zero forcing equalizer.", "o": ["It approximates the inverse of the channel with a linear filter.", "It designs the filter to minimize E[|e|^2], where e is the error signal that is the filter output minus the transmitted signal.", "It processes the incoming signal with a linear filter.", "It augments a linear equalizer by adding a filtered version of previous symbol estimates to the original filter output filter."], "a": 0, "ex": ["Zero-forcing inverts the channel response (forcing ISI to zero) with a linear filter.", "Minimising mean squared error is the MMSE equalizer.", "This describes a generic linear equalizer.", "Feeding back past symbol decisions is a decision-feedback equalizer (DFE)."]}, {"n": 53, "q": "The input of a signal is given; determine the Nyquist frequency needed to successfully reconstruct the original signal.\n(Diagram: square wave with a period of 1.0 ms.)", "o": ["1000Hz", "100Hz", "2Hz", "2000Hz"], "a": 3, "ex": ["1000 Hz is the signal frequency itself (1/1 ms); sampling must be twice that.", "100 Hz is far below the signal frequency.", "2 Hz is far below the signal frequency.", "f = 1/1 ms = 1000 Hz, so the Nyquist rate is 2 x 1000 = 2000 Hz."], "src": "check", "note": "The question text was cut off in the photo. The graph and options match this question, and the caption answer (2000Hz) fits the Nyquist wording, so I used the same wording as the 0.02 s question."}, {"n": 54, "q": "What is the purpose of a source encoder?", "o": ["The source encoder compresses the data into minimum number of bits.", "The source encoder encrypts the signals into unintelligible output.", "The source encoder ensures the integrity of the signal.", "The source encoder decompresses the data into minimum number of bits."], "a": 0, "ex": ["Source coding removes redundancy to represent data in as few bits as possible.", "Encryption is a separate security step.", "Integrity and error protection are the channel encoder's job.", "Decompression happens at the receiver (source decoder), and it expands data rather than minimising it."]}, {"n": 55, "q": "Cyclic Redundancy Check is a technique that involves binary ___________ of the data bits being sent.", "o": ["Addition", "Subtraction", "Division", "Multiplication"], "a": 2, "ex": ["Checksums use addition; CRC doesn't.", "Subtraction is not the core CRC operation.", "CRC divides the data (modulo-2) by a generator polynomial; the remainder is the check value.", "Multiplication is not how the CRC is computed."]}, {"n": 56, "q": "What is one disadvantage of hamming code?", "o": ["Hamming code can only correct burst bit errors.", "Hamming code can only correct MSB bit errors.", "Hamming code can only correct LSB bit errors.", "Hamming code can only correct single bit errors."], "a": 3, "ex": ["Hamming code actually can't correct burst errors.", "It can correct an error at any bit position, not just the MSB.", "It can correct an error at any bit position, not just the LSB.", "Standard Hamming code corrects only one bit error per codeword."]}, {"n": 57, "q": "In hamming code, redundant bits are embedded ___________ the message.", "o": ["In front of", "End of", "Within", "First 2 bits of"], "a": 2, "ex": ["They aren't all placed in front; they're spread through the message.", "They aren't appended at the end; they sit at power-of-two positions.", "Parity bits are interleaved within the message at positions 1, 2, 4, 8, ...", "There are usually more than 2 parity bits, and they aren't grouped at the start."]}, {"n": 58, "q": "Translate the following binary number 101010 into decimal.", "o": ["40", "41", "42", "44"], "a": 2, "ex": ["40 is 101000.", "41 is 101001.", "101010 = 32 + 8 + 2 = 42.", "44 is 101100."]}, {"n": 59, "q": "Given an input signal of 20khz into a digital system, the sampling frequency is determined to be 10khz. Select the statement that best describe what will happen to the output signal.", "o": ["The output signal will be successfully reconstructed.", "The output signal cannot be successfully reconstructed due to aliasing error.", "The output signal will be successfully reconstructed but the output frequency will be altered.", "The output signal will be successfully reconstructed but the output amplitude will be altered."], "a": 1, "ex": ["It needs fs > 40kHz; 10kHz is far too low.", "fs = 10kHz < 2 x 20kHz = 40kHz, so aliasing prevents reconstruction.", "A changed frequency is aliasing, which means the signal was NOT reconstructed successfully.", "Undersampling causes aliasing, not just an amplitude change."]}, {"n": 60, "q": "When will aliasing error in a digital system?", "o": ["Aliasing error will occur when fs < 2fm", "Aliasing error will occur when fs > 2fm", "Aliasing error will occur when fs < fm", "Aliasing error will occur when fs > fm"], "a": 0, "ex": ["Sampling below the Nyquist rate (2fm) causes aliasing.", "fs > 2fm satisfies Nyquist, so there's no aliasing.", "fs < fm does alias, but aliasing already starts below 2fm; that is the general condition.", "fs > fm alone isn't enough; fs must exceed 2fm."]}, {"n": 61, "q": "DPSK encodes two distinct signals, i.e., the carrier and the modulating signal with ___________ phase shift each.", "o": ["90", "180", "270", "360"], "a": 1, "ex": ["90-degree steps are used in QPSK.", "DPSK (binary) uses a 180-degree phase shift relative to the previous symbol.", "270 degrees is not used in binary DPSK.", "A 360-degree shift is no change at all."]}, {"n": 62, "q": "Data-link layer is responsible for implementation of point-to-point flow and ___________ mechanism.", "o": ["Data transfer", "Data connection", "Error control", "Error correction"], "a": 2, "ex": ["Data transfer is a general function, not the paired mechanism.", "Data connection is not the standard term.", "The data-link layer provides flow control and error control (detection plus retransmission).", "Error correction is only one part of error control; the standard pairing is 'flow and error control'."]}, {"n": 63, "q": "There are 3 steps to encode a message using hamming code. Determine the missing step.\nCalculation of total numbers of redundant bits.\n??\nLastly, calculating the values of these redundant bits.", "o": ["Checking the MSB of the redundant bits.", "Calculating the position of the data bits.", "Checking the position of the redundant bits.", "Calculating the position of the redundant bits."], "a": 2, "ex": ["The MSB isn't checked during encoding.", "The redundant-bit positions are fixed first; the data bits fill whatever positions are left.", "Per the photo: step 2 is placing the redundant bits by checking their positions (positions 1, 2, 4, 8, ...).", "Very close in meaning. The photo's answer is c, 'checking' the positions."]}, {"n": 64, "q": "What is the purpose of an Analogue to digital converter?", "o": ["An ADC encodes an analogue signal into a binary code.", "An ADC images an analogue signal into a binary code.", "An ADC decrypts binary code.", "An ADC encodes an analogue signal into an analogue code."], "a": 0, "ex": ["An ADC samples, quantises and encodes an analogue signal as binary.", "'Images' is not what an ADC does.", "Decryption is a security function, not conversion.", "The output of an ADC is digital, not analogue."]}, {"n": 65, "q": "A 16-bit ADC will have a resolution of ___________?", "o": ["65530", "65536", "65540", "65545"], "a": 1, "ex": ["Not a power of two.", "2^16 = 65536 levels.", "Not a power of two.", "Not a power of two."]}, {"n": 66, "q": "One of the error correction technique is described as \"When the receiver detects an error in the data received, it requests back the sender to retransmit the data unit.\", determine the method used.", "o": ["Forward error correction", "Backward error correction", "Auto repeat request", "Cyclic Redundancy technique"], "a": 1, "ex": ["FEC fixes errors at the receiver without retransmission.", "When the receiver asks the sender to retransmit, that is Backward Error Correction.", "ARQ is the protocol that implements backward error correction, but the technique asked for here is BEC.", "CRC only detects errors; it doesn't request retransmission."], "note": "Requesting retransmission is Backward Error Correction, and ARQ is the mechanism that does it, so c) could also be argued. The photo answer is b."}, {"n": 67, "q": "One of the error correction technique is described as \"When the receiver detects some error in the data received, it executes error-correcting code, which helps it to auto-recover and to correct some kinds of errors.\", determine the method used.", "o": ["Forward error correction", "Backward error correction", "Auto repeat request", "Cyclic Redundancy technique"], "a": 0, "ex": ["The receiver corrects errors itself using redundant code: Forward Error Correction.", "Backward correction relies on retransmission.", "ARQ asks the sender to resend rather than self-correcting.", "CRC detects errors but cannot correct them."]}, {"n": 68, "q": "Huffman Coding is generally useful to compress the data in which there are ___________ characters.", "o": ["Frequently occurring", "Uniquely occurring", "Evenly occurring", "Non occurring"], "a": 0, "ex": ["Huffman gives short codes to frequent characters, so it helps when some characters occur often.", "If every character is unique there's no frequency skew to exploit.", "With evenly distributed characters, Huffman gives little or no gain.", "Characters that never occur aren't encoded at all."]}, {"n": 69, "q": "Which statement about Huffman coding is true?", "o": ["Huffman coding is a type of channel coding technique.", "Huffman coding is a type of modulation technique.", "Huffman coding is a type of source coding technique.", "Huffman coding is a type of analogue to digital converter technique."], "a": 2, "ex": ["Channel coding adds redundancy for error control; Huffman removes redundancy.", "Modulation maps bits onto a carrier; Huffman doesn't.", "Huffman is lossless source coding (compression).", "A/D conversion is sampling and quantisation, not Huffman coding."]}, {"n": 101, "q": "Given the diagram, determine the type of signal shown.\n(Diagram: a smooth, continuous waveform that peaks in the centre and ripples out with decreasing amplitude.)", "o": ["Analog signal", "Digital signal", "Analog & digital signal", "Modulated Digital signal"], "a": 0, "ex": ["The waveform varies smoothly and continuously, so it is analog.", "A digital signal would jump between discrete levels.", "It shows only continuous variation, not discrete steps.", "There's no carrier keyed by digital data."]}, {"n": 102, "q": "A seismic equipment shows the following waveform, determine the type of signal shown.\n(Diagram: an irregular, continuously varying seismograph trace.)", "o": ["Analog signal", "Digital signal", "Analog & digital signal", "Modulated Digital signal"], "a": 0, "ex": ["Ground motion recorded by a seismograph varies continuously, so the signal is analog.", "It isn't restricted to discrete levels.", "It is purely continuous.", "It isn't a modulated digital carrier."]}, {"n": 103, "q": "An oscilloscope was used to measure an unknown device; the output of the device was shown. Determine the type of signal shown.\n(Diagram: a sine-shaped output made of discrete flat steps.)", "o": ["Analog signal", "Digital signal", "Analog & digital signal", "Modulated Digital signal"], "a": 1, "ex": ["A staircase made of discrete levels is not continuous, so it isn't analog.", "The output takes only discrete step values, which makes it a digital signal (a quantised sine).", "It is made only of discrete levels.", "There's no carrier being modulated."]}, {"n": 104, "q": "What is the purpose of a channel encoder?", "o": ["The channel encoder compresses the data into minimum number of bits.", "The channel encoder, does the coding for error correction.", "The channel encoder converts to analog from the digital sequence, in order to make it travel through the channel medium.", "The channel encoder, allows the analog signal to transmit from the transmitter end to the receiver end."], "a": 1, "ex": ["Compressing to the minimum number of bits is the source encoder's job.", "The channel encoder adds redundancy so the receiver can detect and correct errors.", "Converting the digital sequence into a signal for the channel is the digital modulator's job.", "Transmitting the analog signal across is done by the channel itself, not the encoder."]}, {"n": 105, "q": "What is the purpose of a digital modulator?", "o": ["The digital modulator compresses the data into minimum number of bits.", "The digital modulator, does the coding for error correction.", "The digital modulator converts to analog from the digital sequence, in order to make it travel through the channel medium.", "The digital modulator, allows the analog signal to transmit from the transmitter end to the receiver end."], "a": 2, "ex": ["Compression is the source encoder's job.", "Error-correction coding is the channel encoder's job.", "The modulator maps the digital bits onto an analog waveform that can travel through the channel.", "This describes the channel, not the modulator."]}, {"n": 106, "q": "A ______ bit ADC will have a resolution of 16.", "o": ["3", "4", "5", "6"], "a": 1, "ex": ["2^3 = 8 levels.", "2^4 = 16 levels.", "2^5 = 32 levels.", "2^6 = 64 levels."]}, {"n": 107, "q": "A 8-bit ADC will have a resolution of ______?", "o": ["511", "127", "15", "256"], "a": 3, "ex": ["511 is 2^9 - 1.", "127 is 2^7 - 1.", "15 is 2^4 - 1.", "2^8 = 256 levels."]}, {"n": 108, "q": "Which statement about baseband transmission is correct?", "o": ["Baseband can only support unidirectional communication.", "Baseband is used for long range communications.", "Baseband is mainly used in Ethernet network.", "Baseband uses analog signals in data transmission."], "a": 2, "ex": ["Baseband supports bidirectional communication.", "Baseband suffers attenuation, so it suits short distances.", "Ethernet LANs are the classic use of baseband transmission.", "Baseband sends digital signals directly; broadband uses analog."]}, {"n": 109, "q": "Given the diagram below, determine which type of transmission technology.\n(Diagram: signals A-D at different frequencies combined by a MUX onto one medium and separated by a DEMUX.)", "o": ["Broadband technology", "Baseband technology", "Amplitude modulation", "Frequency modulation"], "a": 0, "ex": ["Carrying several signals at different frequencies on one medium (FDM) is broadband.", "Baseband uses the whole channel for one signal at a time.", "AM is a modulation method, not a transmission technology.", "FM is a modulation method, not a transmission technology."]}, {"n": 110, "q": "Baseband technology is mainly used in ___ networks to exchange data between nodes.", "o": ["Ethernet", "Unidirectional", "Long distance", "Digital"], "a": 0, "ex": ["Ethernet LANs use baseband transmission.", "Baseband is bidirectional.", "Baseband suits short distances.", "Too vague; the network type asked for is Ethernet."]}, {"n": 111, "q": "Baseband multiplexing combines the signals of multiple nodes, the technology used is", "o": ["Frequency division multiplexing", "Time division multiplexing", "Frequency & time division multiplexing", "Software division multiplexing"], "a": 1, "ex": ["FDM is used by broadband.", "Baseband shares the single channel in time: TDM.", "Baseband doesn't use FDM.", "'Software division multiplexing' isn't a real term."]}, {"n": 112, "q": "Broadband technology uses ___ signals in data transmission.", "o": ["Analog", "Digital", "Analog & digital", "Continuous wave"], "a": 0, "ex": ["Broadband modulates data onto analog carriers.", "Baseband uses digital signals.", "Broadband transmission itself uses analog signals.", "Not the standard term for this."]}, {"n": 113, "q": "Broadband multiplexing combines the signals of multiple nodes, the technology used is", "o": ["Frequency division multiplexing", "Time division multiplexing", "Frequency & time division multiplexing", "Software division multiplexing"], "a": 0, "ex": ["Broadband gives each signal its own frequency band: FDM.", "TDM is used by baseband.", "Broadband uses FDM.", "'Software division multiplexing' isn't a real term."]}, {"n": 114, "q": "Multiplexing can combine signals of multiple nodes, divides the channel (medium or path) into several sub-channels and assigns a sub-channel to each node.", "o": ["Frequency division multiplexing", "Time division multiplexing", "Frequency & time division multiplexing", "Software division multiplexing"], "a": 0, "ex": ["Dividing the channel into frequency sub-channels, one per node, is FDM.", "TDM gives each node time slots, not sub-channels.", "Only frequency division is described.", "'Software division multiplexing' isn't a real term."]}, {"n": 115, "q": "Which statement describes unidirectional communications?", "o": ["Nodes connected at both ends can send or receive data but can't perform them at the same time.", "Nodes connected at both ends can send or receive data at the same time.", "Nodes connected at both ends can only send data one way at certain time interval.", "Nodes connected at both ends can only receive data."], "a": 2, "ex": ["This is half-duplex: both directions are possible, just not at the same time. That isn't unidirectional.", "This is full-duplex (bidirectional).", "Data flowing only one way is unidirectional (simplex).", "Only receiving describes one end of a simplex link, not the communication mode."], "src": "corrected", "note": "Corrected: the photo caption said a), but the answer is c). Unidirectional (simplex) communication means data flows in one direction only. Option a describes half-duplex.", "cap": "a"}, {"n": 116, "q": "Which statement about NRZ is true?", "o": ["In NRZ-I, bit 1 represents a high voltage while bit 0 represents a low voltage.", "In NRZ-I, bit 1 represents a low voltage while bit 0 represents a high voltage.", "In NRZ-I, bit 1 represents a transition in voltage while bit 0 represents no transition.", "In NRZ-I, bit 1 represents a high to low voltage transition while bit 0 represents low to high voltage transition."], "a": 0, "ex": ["NRZ (NRZ-L): 1 is a high level and 0 is a low level. The options all say 'NRZ-I' in the source.", "This is inverted polarity, not the usual NRZ.", "Transition-based coding is NRZ-I.", "Mid-bit transitions are Manchester."]}, {"n": 117, "q": "Which statement about Manchester coding is true?", "o": ["In NRZ-I, bit 1 represents a high voltage while bit 0 represents a low voltage.", "In NRZ-I, bit 1 represents a low voltage while bit 0 represents a high voltage.", "In NRZ-I, bit 1 represents a transition in voltage while bit 0 represents no transition.", "In NRZ-I, bit 1 represents a high to low voltage transition while bit 0 represents low to high voltage transition."], "a": 3, "ex": ["Fixed levels are NRZ.", "Fixed levels are NRZ.", "Transition-or-not is NRZ-I.", "Manchester always has a mid-bit transition whose direction encodes the bit. The options all say 'NRZ-I' in the source."]}, {"n": 118, "q": "Given the diagram, determine the type of baseband coding technique given as \"unknown\".\n(Diagram: clock and data shown; the unknown signal has a transition in the middle of every bit.)", "o": ["NRZ", "NRZ-I", "Manchester coding", "Bipolar coding"], "a": 2, "ex": ["NRZ has no mid-bit transitions.", "NRZ-I only transitions at the start of 1 bits.", "A transition in the middle of every bit is Manchester coding.", "Bipolar coding alternates pulse polarity for 1s."]}, {"n": 119, "q": "Given the diagram, determine the type of baseband coding technique given as \"unknown\".\n(Diagram: data 1010011100 1; the unknown signal is zero for each 0 and gives pulses of alternating polarity for each 1.)", "o": ["NRZ", "NRZ-I", "Manchester coding", "Bipolar coding"], "a": 3, "ex": ["NRZ is two-level and doesn't alternate.", "NRZ-I is two-level and transition-based.", "Manchester has a mid-bit transition every bit.", "Zero for 0 and alternating +/- pulses for 1 is bipolar (AMI) coding."]}, {"n": 120, "q": "Select the statement that best describe Controller-based modem.", "o": ["A hardware modem is a \"Controller-based\" modem, and it does all of the work in the modem or in the PC. All 3 components are in the modem itself.", "A Controller-based modem generates AT commands in the hardware and executes the AT commands in the PC.", "In controller-based modem, all processing is done by the PC, and the \"modem\" is little more than an interface to plug in the phone jack.", "A Controller-based modem is basically a server that performs all 3 functions in the application server."], "a": 0, "ex": ["A controller-based (hardware) modem has the MCU, data pump and DAA all in the modem.", "AT commands are executed by the modem's controller, not the PC.", "PC-does-everything describes a software/host-based modem.", "A modem isn't an application server."]}, {"n": 121, "q": "What is the maximum cable distance that can be connected from a workstation to a modem?\n(Diagram: Workstation -- distance? -- Modem -- phone line.)", "o": ["50m", "100m", "200m", "500m"], "a": 1, "ex": ["Not the answer given.", "Per the photo, 100 m.", "Not the answer given.", "Not the answer given."], "src": "check", "note": "Answer from the photo caption. I couldn't confirm it: a standard RS-232 serial link is usually rated to about 15 m, while 100 m is the Ethernet limit. Check your course notes."}, {"n": 122, "q": "Which statement about Huffman coding is true?", "o": ["Huffman coding is commonly used in music companding.", "Huffman coding is commonly used in speech companding.", "Huffman coding is commonly used for alphabetic data compression", "Huffman coding is commonly used for binary data compression"], "a": 3, "ex": ["Companding (u-law/A-law) is amplitude compression, not Huffman.", "Speech companding uses u-law/A-law, not Huffman.", "Huffman works on any symbols, not just letters. Not the photo's answer.", "Per the photo: Huffman is widely used for general binary data compression (ZIP, JPEG, etc.)."]}, {"n": 123, "q": "Huffman coding is used on a string of characters, 25 in total. Supposedly each character occupies 8 bits. Estimate the output bits in total if Huffman coding is used on the string of 25 characters.", "o": ["200 bits", "250 bits", "195 bits", "140 bits"], "a": 0, "ex": ["The photo's answer. But 25 x 8 = 200 is the size BEFORE compression.", "250 bits is larger than the uncompressed 200 bits.", "Just under 200 bits would be very little compression.", "A smaller, compressed size. The actual value depends on the character frequencies."], "src": "disputed", "note": "Kept the caption's answer a) 200 bits, but it is doubtful: 25 x 8 = 200 is the size BEFORE compression, and Huffman output should be smaller. None of the options can be shown to be correct without the character frequencies (probably in a missing table). Check with your lecturer."}, {"n": 124, "q": "Huffman Coding prevents any ambiguity in the decoding process using the concept of ___.", "o": ["Suffix code", "Prefix code", "Hifix code", "Non unique code"], "a": 1, "ex": ["Huffman doesn't rely on suffixes.", "No codeword is a prefix of another (a prefix-free code), so decoding is unambiguous.", "Not a real term.", "Non-unique codes would cause ambiguity."]}, {"n": 125, "q": "Huffman coding is used in conventional compression format like", "o": ["GZIP, BZIP2, PKZIP", "WINZIP, WINRAR, WINZIP2", "U-Law, A-Law", "GZIP, WINZIP, U-law"], "a": 0, "ex": ["GZIP, BZIP2 and PKZIP all use Huffman coding.", "These are archiver apps, and 'WINZIP2' isn't a format.", "u-law/A-law are companding standards.", "u-law isn't a Huffman-based format."]}, {"n": 126, "q": "Given the diagram, determine new encoded word for \"A\".\n(Diagram: Huffman tree; the root splits into two nodes, the left gives leaves A and B, the right gives C and D; left branches = 0, right = 1.)", "o": ["00", "01", "11", "10"], "a": 0, "ex": ["A is reached left then left: 00.", "01 is left-right (B).", "11 is right-right (D).", "10 is right-left (C)."], "src": "check", "note": "The tree is described in words because the diagram isn't available. The caption answer is 00."}, {"n": 127, "q": "The diagram shows the Huffman table for the encoded word: \"11110101111111110111111110\". Determine the decoded word.\nA: 00, B: 010, C: 011, D: 100, E: 101, F: 110, G: 1110, H: 11110, I: 111110, J: 1111110, K: 11111110, L: 111111110", "o": ["FAIL", "DEAD", "HELL", "HEALAN"], "a": 2, "ex": ["FAIL would start 110 00.", "DEAD would be 100 101 00 100.", "11110 | 101 | 111111110 | 111111110 = H E L L.", "HEALAN would contain A (00) and N (not in table)."]}, {"n": 128, "q": "Which statement is true about the μ-law compression formula?", "o": ["The lower the compression factor, the greater the compression.", "X can only be between 0 to 1.", "The compressed output y is normalized to 2.", "For north America and japan application, compression factor is set to 255."], "a": 3, "ex": ["A higher μ gives more compression.", "x is normalised to -1..+1, not just 0..1.", "y is normalised to ±1, not 2.", "μ = 255 is the standard for North America and Japan."]}, {"n": 129, "q": "Which statement is false about μ-law compression.", "o": ["μ=0 means no compression factor", "μ=255 is the maximum compression factor.", "μ=100 have much more compression than μ=50.", "The larger the value of μ, results into larger compression of output to input with higher amplitude."], "a": 1, "ex": ["True: μ = 0 gives a linear (uncompressed) response.", "False: 255 is the standard value in North America and Japan, not a maximum; μ could be larger.", "True: a larger μ means more compression.", "True: a larger μ compresses high amplitudes more."]}, {"n": 130, "q": "The diagram shows a μ-law compressor block diagram, determine the unknown A & B.\n(Diagram: Vin(t) -> [A] -> [B] -> Dout(n).)", "o": ["A=A(t), B=compander", "A=μ(t), B=8-bit ADC", "A=a(t), B=16-bit SDC", "A=8-bit ADC, B=μ(t)"], "a": 1, "ex": ["A(t) is A-law, and a compander isn't the output block.", "The analog signal is μ-law compressed first, then digitised by an 8-bit ADC.", "There is no '16-bit SDC'.", "The order is reversed: compression comes before the ADC."]}, {"n": 131, "q": "What is channel impairment?", "o": ["In communication system, digital signals travel through space, which tends to improve the quality of analog signal. This perfection causes signal impairment. This means that received signal is the same as the signal that was send.", "Channel impairment means a fortuitous event involving electronic circuitry within the channel that causes the channel to suddenly lose its ability to function as it had been functioning immediately before such event.", "Channel impairment occurs when the physical, chemical, or biological characteristics of channel become harmful to the environment or organisms, including humans, by which the usefulness of the channel is in some way reduced.", "In communication system, analog signals travel through transmission media, which tends to deteriorate the quality of analog signal. This imperfection causes signal impairment. This means that received signal is not same as the signal that was send."], "a": 3, "ex": ["Impairment degrades the signal; it doesn't improve it.", "This describes a sudden failure, not impairment.", "This describes environmental pollution.", "Impairment is the deterioration of the signal through the medium, so the received signal differs from the one sent."]}, {"n": 132, "q": "What are some of the causes of channel impairment?", "o": ["Cosmic interference", "Spatial compression", "Attenuation", "Distortion"], "a": 3, "ex": ["Not one of the standard causes.", "Not a real impairment.", "Attenuation is also an impairment, but the photo's answer is d.", "Per the photo, distortion. The standard impairments are attenuation, distortion and noise."], "src": "check", "note": "Attenuation (c) and distortion (d) are both standard causes of channel impairment. The photo caption picks d."}, {"n": 133, "q": "Select the statement that describes channel Impairment-Distortion.", "o": ["The random or unwanted signal that mixes up with the original signal is called distortion. There are several types of distortion such as induced distortion, crosstalk distortion, thermal distortion and impulse distortion which may corrupt the signal.", "It means loss of energy. The strength of signal decreases with increasing distance which causes loss of energy in overcoming resistance of medium.", "It means change in the shape of signal. This is generally seen in composite signals with different frequencies. Each frequency component has its own propagation speed travelling through a medium.", "It means loss of power. The shape of signal decreases with increasing distance which causes disturbed energy."], "a": 2, "ex": ["A random unwanted signal mixing in is noise.", "Loss of energy with distance is attenuation.", "Distortion is a change in the signal's shape, because frequency components travel at different speeds.", "Loss of power is attenuation, and 'the shape decreases' isn't meaningful."]}, {"n": 134, "q": "Given the diagram, determine the type of channel impairment.\n(Diagram: Before = clean sine wave; After = the same sine wave with jagged, irregular noise on it.)", "o": ["Cosmic interference", "Spatial compression", "Attenuation", "Distortion"], "a": 3, "ex": ["Not a standard impairment.", "Not a real impairment.", "The amplitude is unchanged, so it isn't attenuation.", "Per the photo: the waveform's shape is corrupted. Strictly this looks like noise, but distortion is the closest option."]}, {"n": 135, "q": "Given the diagram, determine the type of channel impairment.\n(Diagram: Input = a tall waveform; Output = the same shape with a much smaller amplitude.)", "o": ["Cosmic interference", "Spatial compression", "Attenuation", "Distortion"], "a": 2, "ex": ["Not a standard impairment.", "Not a real impairment.", "Same shape but reduced amplitude means the signal lost energy: attenuation.", "Distortion would change the shape."]}, {"n": 136, "q": "What is single bit error?", "o": ["The change made in one bit in the entire data sequence.", "The change in one bit at the MSB.", "The change in one bit at LSB."], "a": 0, "ex": ["A single-bit error is exactly one bit changed anywhere in the data.", "It can be any bit, not only the MSB.", "It can be any bit, not only the LSB."], "src": "check", "note": "Option d) was cut off in the photo, so only a)-c) are shown."}, {"n": 137, "q": "Which statement describes burst error?", "o": ["The change made in one bit in the entire data sequence.", "The change in the one bit at the MSB.", "The change in one bit at LSB.", "The change in the set of bits in data sequence."], "a": 3, "ex": ["That is a single-bit error.", "A single bit at a fixed position isn't a burst.", "A single bit at a fixed position isn't a burst.", "A burst error corrupts a set of consecutive bits."]}, {"n": 138, "q": "Which statement describes multiple bit error?", "o": ["The change made in one bit in the entire data sequence.", "The change in two or more bits of a data sequence of a transmitter to receiver.", "The change in one bit at LSB.", "The change in the set of bits in data sequence."], "a": 1, "ex": ["That is a single-bit error.", "A multiple-bit error is two or more bits changed between transmitter and receiver.", "That is a single bit.", "A set of consecutive bits is a burst error."]}, {"n": 139, "q": "Given the diagram, determine the type of error.\n(Diagram titled 'Burst error': Sent 0100010001000011 vs Received with a run of consecutive bits flipped.)", "o": ["Single bit error", "Multiple bit error", "Burst error", "Multiple burst error"], "a": 2, "ex": ["More than one bit changed.", "The changed bits are consecutive, so it's specifically a burst.", "A run of consecutive corrupted bits is a burst error.", "There is only one run."]}, {"n": 140, "q": "___ is a method of detecting the errors which are present in the data transmitted from a transmitter to receiver in a data communication system.", "o": ["Error detection", "Error correction", "Redundancy detection", "Error checking"], "a": 0, "ex": ["Detecting errors in the received data is error detection.", "Correction fixes errors; the question asks about detecting.", "Not the standard term.", "Not the standard term."]}, {"n": 141, "q": "Error detecting codes uses ___ to find errors, by adding to the data when it is transmitted from the source.", "o": ["Detecting codes", "Parity codes", "Checking codes", "Redundancy codes"], "a": 3, "ex": ["Circular: these ARE the error-detecting codes.", "Parity is one kind of redundancy, but the general term is redundancy codes.", "Not the standard term.", "Extra redundant bits are added so the receiver can detect errors."]}, {"n": 142, "q": "Given the diagram, determine the answer if the binary sequence is used to generate an even parity output.\nBits: 1 1 1 1 1 1 1 1 ?", "o": ["0", "1", "10" e Repeat resends only the lost frame.", "'Stop and release ARQ' isn't a real protocol."], "src": "corrected", "note": "Corrected: the photo caption said d), but the answer is b). Resending every frame from the unacknowledged one onward is Go-Back-N. 'Stop and release ARQ' isn't a real protocol.", "cap": "d"}, {"n": 147, "q": "One of the data-link control protocol is described as: \"This protocol also provides for sending multiple frames before receiving the acknowledgment for the first frame. However, here only the erroneous or lost frames are retransmitted, while the good frames are received and buffered.\", determine the type of flow control that is described.", "o": ["Stop and wait ARQ", "Go-back N ARQ", "Selective Repeat ARQ", "Stop and release ARQ"], "a": 2, "ex": ["Stop-and-wait sends one frame at a time.", "Go-Back-N resends everything from the lost frame onward.", "Resending only the bad frames while buffering the good ones is Selective Repeat.", "Not a real protocol."]}, {"n": 148, "q": "Which of the following error control technique is Backward error correction?", "o": ["Parity bit check", "Hamming code", "Convolutional code", "Stop and wait ARQ"], "a": 3, "ex": ["A parity check only detects errors; on its own it doesn't correct anything.", "Hamming code is forward error correction.", "Convolutional codes are forward error correction.", "Detecting an error and asking for retransmission is backward error correction, and Stop-and-wait ARQ does exactly that."], "src": "corrected", "note": "Corrected: the photo caption said a), but the answer is d). Backward error correction means the receiver detects the error and requests retransmission, i.e. ARQ. A parity check only detects errors.", "cap": "a"}, {"n": 149, "q": "Which of the following error control technique is Forward error correction?", "o": ["Parity bit check", "Hamming code", "Cyclic code", "Stop and wait ARQ"], "a": 1, "ex": ["Parity only detects errors.", "Hamming code lets the receiver correct errors itself, which makes it forward error correction.", "CRC/cyclic codes are mainly used for detection.", "ARQ is backward (retransmission) correction."]}, {"n": 150, "q": "Data encryption standard (DES) had been used in digital modulation process, DES is a ___ cipher type.", "o": ["Symmetric-key Bit", "Symmetric-key Byte", "Symmetric-key Block", "Block chain"], "a": 2, "ex": ["DES works on blocks, not single bits.", "DES works on 64-bit blocks.", "DES is a symmetric-key block cipher (64-bit blocks).", "Blockchain is unrelated."]}, {"n": 151, "q": "What are one of the factor that influence digital modulation?", "o": ["Low BER at low received SIR (signal interference ratio)", "Low spectral efficiency", "Perform well at wave reflection and wave diffusion", "Low power requirement"], "a": 0, "ex": ["A good scheme achieves a low BER even when the received SIR is low.", "You want HIGH spectral efficiency.", "Not a standard selection factor.", "Not the factor listed in the course."]}, {"n": 152, "q": "What are one of the factor that influence digital modulation?", "o": ["The source information is normally represented as a high frequency signal.", "The performance of a modulation scheme is often measured in terms of its power efficiency and bandwidth efficiency.", "Low BER at high received SIR (signal interference ratio)", "Low spectral efficiency"], "a": 1, "ex": ["Source information is normally baseband (low frequency).", "Modulation schemes are judged by power efficiency and bandwidth efficiency.", "The factor is low BER at LOW SIR.", "You want high spectral efficiency."]}, {"n": 153, "q": "Given the diagram below, determine A,B and C.\n(Diagram, Symmetric Encryption: Plain Text -> Encryption with key A -> Cipher Text -> Decryption with key C -> Plain Text; B links the two keys.)", "o": ["A=Secret key, B=Same Key, C=Secret key", "A=Secret key, B=Secret Key, C=Same key", "A=Same key, B=Same Key, C=Secret key", "A=Secret key, B=Secret Key, C=Secret key"], "a": 0, "ex": ["In ansmitted signal.", "It processes the incoming signal with a linear filter.", "It augments a linear equalizer by adding a filtered version of previous symbol estimates to the original filter output filter."], "a": 2, "ex": ["That is specifically zero-forcing.", "That is specifically MMSE.", "A linear equalizer processes the incoming signal with a linear filter.", "That is a decision-feedback equalizer."]}, {"n": 159, "q": "Inter symbol in a PCM or data transmission system can be studied experimentally with the help of a display in the ___.", "o": ["Spectral analyzer", "Log meter", "Receiver", "Oscilloscope"], "a": 3, "ex": ["A spectrum analyser shows frequency content, not ISI over time.", "Not used for this.", "The receiver doesn't display it.", "An oscilloscope shows the eye pattern, which reveals ISI."], "src": "check", "note": "The top line of the question was partly cut off in the photo, so the wording is my best reading."}, {"n": 160, "q": "Given the diagram, determine the type of modulator shown.\n(Diagram: a carrier wave generator and a binary data sequence feed a balanced modulator, giving a phase-reversed carrier.)", "o": ["BPSK", "QPSK", "AM-SC"], "a": 0, "ex": ["Binary data driving a balanced modulator flips the carrier phase 0/180 degrees: a BPSK modulator.", "QPSK needs I/Q paths and a serial-to-parallel converter.", "AM-SC uses an analog message, not binary data."], "src": "check", "note": "Option d) was cut off in the photo, so only a)-c) are shown."}, {"n": 161, "q": "Given the diagram, determine the type of modulator shown.\n(Diagram: digital data -> 2-bit serial-to-parallel converter (odd/even bits) -> two mixers fed by a carrier and a 90-degree phase-shifted carrier (PSK_I, PSK_Q) -> summer.)", "o": ["BPSK", "QPSK", "AM-SC", "PSK"], "a": 1, "ex": ["BPSK has a single path.", "Splitting the data into I and Q bit streams on quadrature carriers is QPSK.", "AM-SC has no serial-to-parallel stage.", "'PSK' is too generic; the I/Q structure is specifically QPSK."]}, {"n": 162, "q": "SHA-256 algorithm have a digest size of ___.", "o": ["128bits", "256bits", "512bits", "1024bits"], "a": 1, "ex": ["128 bits is MD5.", "SHA-256 outputs a 256-bit digest.", "512 bits is SHA-256's block size (and SHA-512's digest).", "Too large."]}, {"n": 163, "q": "Which statement explains the process of hashing?", "o": ["Hashing is the process of scrambling raw information to the extent that it cannot reproduce it back to its original form.", "Hashing is the method by which information is converted into secret code that hides the information's true meaning.", "Hashing is a type of public-key hashing algorithm, and it is used to generate an electronic signature.", "Hashing is the process of converting data into a format required for a number of information processing needs."], "a": 0, "ex": ["Hashing is one-way: the original can't be recovered from the hash.", "That describes encryption.", "Hashing isn't a public-key algorithm.", "That describes encoding or data conversion."]}, {"n": 164, "q": "Which statement describes password hashing?", "o": ["Password hashing converts user passwords into a hash value before being stored on the server.", "Password hashing converts user passwords into plaintext before being stored on the server.", "Password hashing converts user passwords into a checksum value before being stored on the server."], "a": 0, "ex": ["The server stores the password's hash, never the password itself.", "Storing plaintext is exactly what hashing avoids.", "A checksum is for error detection, not password security."], "src": "check", "note": "Option d) was cut off in the photo, so only a)-c) are shown."}, {"n": 165, "q": "Given the diagram, determine the type of hashing function shown.\n(Diagram: original hash digest before download 'D3%f@g43*1' = hash calculated after download 'D3%f@g43*1' -> both owner and file verified.)", "o": ["Padding bits", "Initializing the buffers", "Password hashing", "Integrity verification"], "a": 3, const L='ABCD';
const TAGS={mine:'Answer not given in source, supplied',opts:'Options supplied (answer from source)',check:'Reworded / missing info, double-check',disputed:'Disputed: photo answer may be wrong, see note',corrected:'Corrected'};
let deck=[],pos=0,rc=0,ra=0,tc=0,ta=0,round=1,lastId=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newDeck(){deck=shuffle(QS.map((_,i)=>i));if(deck.length>1&&deck[0]===lastId){[deck[0],deck[1]]=[deck[1],deck[0]]}pos=0;rc=0;ra=0}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hud(){$('prog').textContent=`Round ${round} · ${Math.min(pos+1,deck.length)} / ${deck.length}`;$('score').textContent=`Round ${rc}/${ra} · Total ${tc}/${ta}`;$('barfill').style.width=(pos/deck.length*100)+'%'}
function show(){
  if(pos>=deck.length){roundDone();return}
  locked=false;const q=QS[deck[pos]];lastId=deck[pos];hud();
  $('card').innerHTML=(TAGS[q.src]?`<span class="tag">${TAGS[q.src]}${q.cap?' (caption said '+q.cap+')':''}</span>`:'')+
   `<p class="q">${esc(q.q)}</p><div class="opts">`+q.o.map((t,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b><span>${esc(t)}</span></button>`).join('')+
   `</div><div class="flash" id="flash"></div><div id="after"></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  window.scrollTo(0,0);
}
function answer(i){
  if(locked)return;locked=true;const q=QS[deck[pos]];const btns=document.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);ra++;ta++;btns[q.a].classList.add('ok');
  if(i===q.a){rc++;tc++;hud();$('flash').textContent='Correct!';setTimeout(()=>{pos++;show()},900)}
  else{btns[i].classList.add('bad');hud();
    $('after').innerHTML=`<div class="exp"><p><span class="h g">Correct: ${L[q.a]}.</span> ${esc(q.ex[q.a])}</p><p><span class="h r">Your answer, ${L[i]}:</span> ${esc(q.ex[i])}</p>${q.note?`<p><i>Note: ${esc(q.note)}</i></p>`:''}</div><button class="next" id="nx">Next</button>`;
    $('nx').onclick=()=>{pos++;show()};}
}
