<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#0f1218">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MCQ Practice</title>
<style>
:root{color-scheme:dark;--bg:#0f1218;--card:#1a1f29;--ink:#e6e9ef;--mute:#9aa3b2;--line:#323a4a;--acc:#4c6ef5;--ok:#51cf66;--okbg:rgba(81,207,102,.16);--bad:#ff6b6b;--badbg:rgba(255,107,107,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.q{font-weight:600;font-size:18px;white-space:pre-line;margin:0 0 16px}
.tag{line-height:1.3;display:inline-block;font-size:12px;font-weight:600;background:#3a2a14;color:#ffc078;border-radius:6px;padding:2px 8px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:14px;border:2px solid var(--line);border-radius:12px;background:#222834;color:var(--ink);font:inherit;cursor:pointer}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:#323a4a;display:grid;place-items:center;font-size:14px}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok b{background:var(--ok);color:#0f1218}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad b{background:var(--bad);color:#0f1218}
.opt:disabled{cursor:default}
.flash{text-align:center;font-size:22px;font-weight:700;color:var(--ok);margin-top:14px;min-height:30px}
.exp{margin-top:16px;padding:14px;border-radius:12px;background:#141922;border:1px solid var(--line);font-size:15.5px}
.exp p{margin:0 0 10px}.exp p:last-child{margin:0}
.exp .h{font-weight:700}.exp .g{color:var(--ok)}.exp .r{color:var(--bad)}
.next{margin-top:14px;width:100%;min-height:54px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:600 18px inherit;font-family:inherit;cursor:pointer}
.round{text-align:center;padding:30px 10px}
.round h2{margin:0 0 6px}
</style></head><body><div class="wrap">
<div class="top"><span id="prog"></span><span id="score"></span></div>
<div class="bar"><i id="barfill"></i></div>
<div class="card" id="card"></div>
</div>
<script>
const QS=[{"n": 1, "q": "Which statement describes bidirectional communications?", "o": ["Nodes connected at both ends can send or receive data but can't perform them at the same time.", "Nodes connected at both ends can send or receive data at the same time.", "Nodes connected at both ends can only send data one way at certain time interval.", "Nodes connected at both ends can only receive data."], "a": 1, "ex": ["This describes half-duplex: both directions are possible, but only one at a time.", "Bidirectional (full-duplex) communication lets both ends transmit and receive simultaneously.", "Data flowing only one way is simplex, not bidirectional.", "A node that can only receive is one-way (simplex) communication."]}, {"n": 2, "q": "In baseband transmission, the data bits are ___________ converted into signals.", "o": ["Converted to PCM waveforms before being", "Directly", "Low-pass filtered before being", "High-pass filtered before being"], "a": 1, "ex": ["PCM is a way to digitise analog signals; baseband simply sends the existing bits as signal levels without an extra conversion stage.", "Baseband sends the bits directly as signal levels on the medium, with no carrier modulation.", "Filtering is not the defining step; baseband means the bits are put directly onto the line.", "High-pass filtering would remove the low frequencies that baseband signals rely on."]}, {"n": 3, "q": "Which statement about NRZ-I is true?", "o": ["In NRZ-I, bit 1 represents a high voltage while bit 0 represents a low voltage.", "In NRZ-I, bit 1 represents a low voltage while bit 0 represents a high voltage.", "In NRZ-I, bit 1 represents a transition in voltage while bit 0 represents no transition.", "In NRZ-I, bit 1 represents a high to low voltage transition while bit 0 represents low to high voltage transition."], "a": 2, "ex": ["Mapping bits to fixed levels is NRZ-L, not NRZ-I.", "This is also a level-based scheme (inverted NRZ-L); NRZ-I encodes bits by transitions.", "NRZ-I (inverted): a 1 causes the level to flip; a 0 leaves it unchanged.", "Direction-specific transitions in mid-bit describe Manchester encoding, not NRZ-I."]}, {"n": 4, "q": "Select the statement that best describe the functions of a modem.", "o": ["A modem is a device that enables computers to communicate with another non-computer device", "A modem is a peripheral device that enables computers to communicate with each other over conventional telephone lines, ISDN cable lines, or even without wires.", "A modem is a peripheral device that enables computers to store IP addresses and node addresses.", "A modem is a device that enables computers to communicate with application servers and login servers."], "a": 1, "ex": ["A modem links computers to other computers/networks, not specifically to non-computer devices.", "A modem (modulator-demodulator) converts digital data to a form that travels over phone, cable/ISDN or wireless links so computers can talk to each other.", "Storing addresses is not a modem's job; that is for routers/hosts.", "Talking to specific server types is an application-level matter, not what defines a modem."]}, {"n": 5, "q": "A hardware modem consists of three components:", "o": ["Microcontroller unit, Data pump unit and Data access arrangement", "Microcontroller unit, Data storage unit and Data access arrangement", "Microcontroller unit, Data pump unit and Data assist arrangement", "Microcontroller unit, Data usage unit and Data access arrangement"], "a": 0, "ex": ["The three blocks are the MCU (control), the data pump (modulation/DSP) and the DAA (line interface).", "There is no 'data storage unit'; the middle block is the data pump.", "The line interface is the Data ACCESS Arrangement, not 'assist'.", "There is no 'data usage unit'; the middle block is the data pump."]}, {"n": 6, "q": "In a modem, what is the purpose of the Microcontroller unit?", "o": ["The microcontroller unit gets instruction and settings from ROM.", "The microcontroller unit serves as the hardware interface to the Public Switched Telephone System.", "The microcontroller unit checks data for errors and performs compression."], "a": 2, "ex": ["Reading firmware from ROM is incidental, not the MCU's purpose in the modem.", "The interface to the telephone network is the Data Access Arrangement (DAA), not the MCU.", "Per the doc, the MCU handles error checking and data compression (the data pump handles modulation)."]}, {"n": 7, "src": "check", "q": "Using the following lookup table for Huffman Coding, determine the coded sequence for \"DEED\".\nB: 010\nC: 011\nD: 100\nE: 101\nF: 110\nG: 1110\nH: 11110\nI: 111110\nJ: 1111110\nK: 11111110\nL: 111111110", "o": ["100101101100", "100101100101", "101100100101", "100110110100"], "a": 0, "note": "The doc asks for \"DEAD\", but its table has no code for A, so the word was changed to DEED, which uses only letters in the table. If your source gives a code for A (e.g. A: 00), DEAD would be 100 101 [A] 100.", "ex": ["D=100, E=101, E=101, D=100, giving 100 101 101 100.", "100 101 100 101 decodes to D E D E, which is the wrong order.", "101 100 100 101 decodes to E D D E.", "100 110 110 100 decodes to D F F D (110 is F, not E)."]}, {"n": 8, "q": "Translate the following binary number 111000 into decimal.", "o": ["56", "58", "63", "126"], "a": 0, "ex": ["111000 = 32 + 16 + 8 = 56.", "58 would be 111010.", "63 is 111111.", "126 is 1111110 (7 bits)."]}, {"n": 9, "q": "Translate the following decimal number 128 into binary.", "o": ["100000", "1000000", "10000000", "10000"], "a": 2, "ex": ["100000 = 32.", "1000000 = 64.", "128 = 2^7, so it's a 1 followed by seven 0s: 10000000.", "10000 = 16."]}, {"n": 10, "q": "Given an input signal of 10kHz input into a digital system, determine the sampling frequency for a successful reconstruction of the original system.", "o": ["5kHz", "7kHz", "10kHz", "22kHz"], "a": 3, "ex": ["5kHz is below 2 x 10kHz = 20kHz, so aliasing occurs.", "7kHz is below the 20kHz Nyquist rate.", "Sampling at the signal frequency (10kHz) is far below 20kHz and aliases.", "Nyquist needs fs > 2fm = 20kHz; 22kHz is the only option above that."]}, {"n": 11, "q": "Given an input signal of 15kHz into a digital system, determine the sampling frequency for a successful reconstruction of the original system.", "o": ["10kHz", "20kHz", "15kHz", "40kHz"], "a": 3, "ex": ["10kHz is below the 30kHz Nyquist rate.", "20kHz is below 2 x 15kHz = 30kHz.", "15kHz equals fm, well below 30kHz.", "Nyquist needs fs > 2fm = 30kHz; only 40kHz qualifies."]}, {"n": 12, "q": "Translate the following decimal number 67 into binary.", "o": ["1001111", "1110000", "1000011", "1100011"], "a": 2, "ex": ["1001111 = 64+8+4+2+1 = 79.", "1110000 = 64+32+16 = 112.", "67 = 64 + 2 + 1 = 1000011.", "1100011 = 64+32+2+1 = 99."]}, {"n": 13, "q": "Which statement about binary arithmetic is correct?", "o": ["Binary division will always result in a quotient and reminder", "Binary arithmetic does not have carry or borrow", "Binary subtraction will always need a borrow", "0x1=1"], "a": 0, "src": "mine", "ex": ["The other three are clearly false, so this is the intended answer: division produces a quotient and a remainder (which may be 0).", "Binary arithmetic does use carries (1+1=10) and borrows (0-1).", "Many subtractions need no borrow, e.g. 1-0 = 1.", "Anything multiplied by 0 is 0, so 0x1 = 0."]}, {"n": 14, "q": "When plotted on a voltage vs. time graph, ___________ should produce a smooth and continuous curve.", "o": ["Analog signal", "Digital signal", "Analog & digital signal", "Modulated Digital signal"], "a": 0, "ex": ["Analog signals vary continuously, giving a smooth curve.", "Digital signals jump between discrete levels, giving a step/square shape.", "Only analog is smooth; digital is not.", "A modulated digital signal still carries abrupt (discrete) changes."]}, {"n": 15, "q": "Binary is a base number system.", "o": ["2", "4", "10", "16"], "a": 0, "ex": ["Binary uses two digits (0 and 1), so it is base 2.", "Base 4 is quaternary.", "Base 10 is decimal.", "Base 16 is hexadecimal."]}, {"n": 16, "q": "Decimal is a base number system.", "o": ["2", "4", "10", "16"], "a": 2, "ex": ["Base 2 is binary.", "Base 4 is quaternary.", "Decimal uses ten digits (0-9), so it is base 10.", "Base 16 is hexadecimal."]}, {"n": 17, "q": "In Data encryption standard(DES), there are 5 steps involved. The steps are shown below, determine the missing step.\nKey transformation -> Expansion permutation -> ___________ -> P-box permutation -> XOR and swap", "o": ["64-byte swap", "C-transpose", "S-box permutation", "And or swap"], "a": 2, "ex": ["There is no 64-byte swap in a DES round.", "'C-transpose' is not a DES step.", "After expansion and XOR with the round key, the 48 bits go through the S-boxes (substitution) before the P-box.", "'And or swap' is not a DES step; the round ends with XOR and swap."]}, {"n": 18, "q": "In expansion permutation, the left plain text(LPT) is expanded from 32 bits to ___________.", "o": ["64 bits", "64 bytes", "48 bits", "48 bytes"], "a": 2, "ex": ["64 bits is the full DES block, not the expanded half.", "DES works in bits; 64 bytes is far too large.", "The 32-bit half is expanded to 48 bits so it can be XORed with the 48-bit round key.", "Wrong unit; it's 48 bits, not bytes."]}, {"n": 19, "q": "Given a diagram with nodes A, B, C, D branching from a root node, determine the coded value for node B.", "o": ["00", "01", "10", "11"], "a": 1, "src": "hedged", "ex": ["00 is left-left, which would be node A.", "Per the doc: left branches are 0 and right are 1; B is reached left then right, giving 01.", "10 is right-left (node C in the usual layout).", "11 is right-right (node D in the usual layout)."]}, {"n": 20, "q": "JPEG is a ___________ image compression method", "o": ["Lossy", "Loss-less", "Compact less", "Compact ratio"], "a": 0, "ex": ["JPEG discards detail during quantization, so it is lossy.", "Standard JPEG is not lossless; formats like PNG are.", "'Compact less' is not a compression category.", "'Compact ratio' is not a compression category."]}, {"n": 21, "src": "check", "q": "In the step 2 of JPEG conversion, it uses which method to convert it to colours?", "o": ["Colour space conversion from RGB to YCbCr", "Discrete Cosine Transform (DCT)", "Zigzag scan", "Run-length encoding"], "a": 0, "note": "The doc has no options or answer for this one. This assumes the common 8-step order: 1 split into 8x8 blocks, 2 RGB to YCbCr, 3 DCT, 4 quantisation, 5 zigzag, 6 DPCM on DC, 7 RLE on AC, 8 Huffman, which matches the doc's steps 5 and 6. If your notes number the steps differently, the answer may differ.", "ex": ["Each block is converted from RGB to YCbCr (luminance plus two chrominance channels), so that colour detail can be compressed more than brightness.", "The DCT converts pixel values into frequency coefficients (step 3); it doesn't deal with colour.", "The zigzag scan (step 5) orders the coefficients into a 1x64 vector.", "Run-length encoding compresses the runs of zero AC coefficients late in the process; it isn't a colour conversion."]}, {"n": 22, "q": "Given the diagram showing a step-like signal with values +1V, +0.5V, -0.5V, -1V, determine the type of signal shown.", "o": ["Analog signal", "Digital signal", "Analog & digital signal", "Modulated Analog signal"], "a": 1, "ex": ["An analog signal varies smoothly, not in steps.", "A step-like signal taking only a few discrete levels is digital (here, 4 levels).", "It has only discrete levels, so it isn't analog as well.", "There is no carrier, so it isn't a modulated analog signal."]}, {"n": 23, "q": "Digital signatures follow ___________ encryption methodology to verify the authenticity of a document/file.", "o": ["Symmetric", "Asymmetric", "Standard", "Hash"], "a": 1, "ex": ["Symmetric keys are shared, so they can't prove which party signed.", "The signer uses their private key and anyone verifies with the public key: asymmetric cryptography.", "'Standard' is not an encryption methodology.", "Hashing is used inside signatures, but a hash alone isn't encryption and can't prove who signed."]}, {"n": 24, "src": "opts", "q": "Given the diagram showing a padlock combining \"Password123\" and a file to generate a hash \"D3%f@g43*1\", determine the type of function missing.", "o": ["Hash function", "Symmetric encryption function", "Asymmetric encryption function", "Encoding function"], "a": 0, "ex": ["A hash function turns the input (here the password plus the file) into a fixed-length digest like \"D3%f@g43*1\" that can't be reversed. The output is even called a hash.", "Symmetric encryption produces ciphertext that can be decrypted with the key; its output isn't a hash.", "Asymmetric encryption uses a public/private key pair and produces reversible ciphertext, not a hash digest.", "Encoding (e.g. Base64) is reversible and uses no key or one-way function."]}, {"n": 25, "q": "There are several ways to build a u-law expander, one of the method is ___________.", "o": ["Loop-up table", "Partial mathematical operation", "Linear approximation", "Partial differentiation"], "a": 2, "ex": ["Not the answer the doc gives for this question.", "'Partial mathematical operation' is not a recognised method.", "Per the doc: the u-law curve can be built with a piecewise linear approximation (segments).", "Differentiation is not used to build an expander."]}, {"n": 26, "q": "In the step 6 of Jpeg compression, the ___________ is applied to the DC component.", "o": ["Different pulse code modulation", "Differential digital code modulation", "Fourier transform", "Pulse code modulation"], "a": 1, "src": "hedged", "ex": ["Not the doc's answer (note the wording is 'Different', not 'Differential').", "Per the doc: the DC coefficients are coded differentially from block to block (strictly DPCM; the doc picks this as the closest option).", "JPEG uses the DCT on blocks, not a Fourier transform on the DC term.", "Plain PCM doesn't exploit the similarity of neighbouring DC values."]}, {"n": 27, "q": "In the step 5 of Jpeg compression, The zigzag scan is used to map the 8x8 matrix to a ___________ vector.", "o": ["8x4", "8x8", "2x64", "1x64"], "a": 3, "ex": ["8x4 holds only 32 values and isn't a vector.", "8x8 is the original matrix, not a vector.", "2x64 would hold 128 values.", "Zigzag reads all 64 coefficients into a single 1x64 vector."]}, {"n": 28, "q": "Given the diagram showing a digital signal (a) and a modulated signal (b) where the phase changes at each bit transition (1 to 0 or 0 to 1), determine the type of modulating scheme.", "o": ["BPSK", "QPSK", "AM-SC", "DPSK"], "a": 0, "ex": ["In BPSK, each bit value has its own phase (0 or 180 degrees), so the phase flips whenever the bit changes.", "QPSK uses four phases, two bits per symbol.", "AM-SC varies amplitude, not phase.", "In DPSK the phase change depends on the current bit relative to the previous symbol, not simply on bit transitions."]}, {"n": 29, "q": "What is insertion loss in an eye diagram?", "o": ["A frequency dependent loss of signal power that is dependent on channel length and material properties.", "An amplitude dependent loss of signal power that is dependent on channel length and material properties.", "A phase dependent loss of signal power that is dependent on channel length and material properties.", "A time dependent loss of signal power that is dependent on channel length and material properties."], "a": 0, "src": "mine", "ex": ["Insertion loss rises with frequency (skin effect, dielectric loss) and with channel length, closing the eye.", "Insertion loss doesn't depend on signal amplitude.", "Insertion loss isn't defined by phase.", "Insertion loss is characterised over frequency, not time."]}, {"n": 30, "q": "One of the steps in SHA-256 algorithm is described as: \"The entire message gets broken down into multiple blocks of 512 bits each. It puts each block through 64 rounds of operation, with the output of each block serving as the input for the following block.\" Select the step described.", "o": ["Padding bits", "Initializing the buffers", "Compression function", "Output"], "a": 2, "ex": ["Padding only extends the message to the right length.", "Initializing sets the starting hash values (H0-H7).", "The compression function processes each 512-bit block through 64 rounds, chaining outputs.", "Output is the final 256-bit digest after all blocks."]}, {"n": 31, "q": "Translate the following binary number 111111 into decimal.", "o": ["64", "58", "63", "126"], "a": 2, "ex": ["64 is 1000000.", "58 is 111010.", "111111 = 32+16+8+4+2+1 = 63.", "126 is 1111110."]}, {"n": 32, "q": "Data encryption standard uses ___________ key length to process the data block.", "o": ["64 byte", "56 bits", "64 bits", "56 bytes"], "a": 1, "ex": ["DES keys are measured in bits, not bytes.", "DES has an effective 56-bit key (64 bits supplied, 8 are parity).", "64 bits is the supplied key size including 8 parity bits; the doc takes 56 bits as the answer.", "Wrong unit; it's 56 bits."]}, {"n": 33, "q": "4 digital systems have a measured BER of certain value. Select the best system among them.", "o": ["Digital system A BER=0.001%", "Digital system B BER=0.000001%", "Digital system C BER=100%", "Digital system D BER=10000%"], "a": 1, "ex": ["0.001% is 1000 times worse than system B.", "Lowest bit error rate means the fewest errors, so B is best.", "100% means every bit is wrong.", "BER can't exceed 100%; this value is meaningless."]}, {"n": 34, "q": "What is the function of initial permutation?", "o": ["The Initial permutation (IP) happens only once and it happens before the first round. It suggests how the transposition in IP should proceed.", "The Initial permutation (IP) happens after left plain text. It suggests how the transposition in IP should proceed.", "The Initial permutation (IP) happens after left plain text. It suggests how many bit/byte the key length should have.", "The Initial permutation (IP) happens only once and it happens before the first round. It suggests how the S-box permutation should proceed."], "a": 0, "src": "mine", "ex": ["IP is applied once to the 64-bit block before round 1, and its table defines how the bits are transposed.", "IP comes before the block is split into left/right plaintext, not after.", "IP doesn't come after the LPT, and it doesn't set the key length.", "IP doesn't control the S-boxes; those are fixed substitution tables used inside each round."]}, {"n": 35, "src": "check", "q": "In eye diagram, which point is the best time to sample (decision point)?", "o": ["At the centre of the eye opening, where the vertical opening is largest", "At the zero crossings, where the traces cross", "At the edge of the eye, at the start of each bit period", "At the point of maximum overshoot above the eye"], "a": 0, "note": "The doc's answer is \"point B\" on a diagram that isn't in the doc, so the options here describe the location instead. The doc says B is the centre of the eye.", "ex": ["The middle of the eye has the largest vertical opening (best noise margin) and is furthest from the transitions (best timing margin).", "At the zero crossings the signal is changing between levels, and jitter is greatest there.", "The edge of the eye is where the transitions happen, so the margin there is smallest.", "Overshoot is distortion outside the eye; sampling there gives no better decision."]}, {"n": 36, "q": "Determine the binary arithmetic: 1/0", "o": ["0", "1", "10", "Not allowed"], "a": 3, "ex": ["Division by zero has no value.", "Division by zero is undefined, not 1.", "10 (=2) is not a result of division by zero.", "Division by zero is undefined in binary just as in decimal."]}, {"n": 37, "q": "Determine the binary arithmetic: 0/0", "o": ["0", "1", "10", "Not allowed"], "a": 3, "ex": ["0/0 is undefined, not 0.", "0/0 is undefined, not 1.", "10 is not a result of 0/0.", "Division by zero, including 0/0, is undefined."]}, {"n": 38, "q": "Determine the binary arithmetic: 0+0+1", "o": ["0", "1", "10", "Not allowed"], "a": 1, "ex": ["0 ignores the +1.", "0 + 0 + 1 = 1.", "10 (=2) would be 1+1.", "Addition is always allowed."]}, {"n": 39, "q": "Given the diagram showing a digital signal and a modulated signal where the phase shifts by 180 degrees only when the digital signal changes state, determine the type of modulating scheme.", "o": ["BPSK", "QPSK", "AM-SC", "DPSK"], "a": 0, "src": "mine", "note": "This is diagram-based and reads almost the same as another question in the doc, which the doc answers with BPSK. Check against your course notes.", "ex": ["In BPSK, each bit value has a fixed phase (0 or 180 degrees), so a 180-degree shift happens exactly when the data changes state.", "QPSK uses 90-degree phase steps for 2-bit symbols.", "AM-SC changes amplitude, not phase.", "In DPSK the phase shift depends on the current bit (e.g. shift on a '1'), not on the data changing state."]}, {"n": 40, "q": "The following modulation scheme is described as: \"It is a Suppressed Carrier DSBSC modulation scheme, which sends two bits of digital information at a time, called as digits.\", determine the type of modulator described.", "o": ["BPSK", "QPSK", "AM-SC", "DPSK"], "a": 1, "ex": ["BPSK sends one bit per symbol.", "QPSK sends two bits (a 'dibit') per symbol using four phases.", "AM-SC is analog amplitude modulation, not a two-bit digital scheme.", "DPSK sends one bit per symbol, encoded differentially."]}, {"n": 41, "q": "A digital signal is a signal that represents data as a sequence of discrete values. A digital signal can only take on one value from a ___________ set of possible values at a given time.", "o": ["Finite", "Infinite", "Distinct", "Indistinct"], "a": 0, "ex": ["A digital signal picks from a limited (finite) set of levels.", "An infinite set of values describes analog signals.", "The values are distinct, but the key property asked for is that the set is finite.", "Indistinct values contradict the idea of discrete levels."]}, {"n": 42, "q": "Determine the binary arithmetic: 1x1", "o": ["0", "1", "10", "Not allowed"], "a": 1, "ex": ["0 would be a product involving 0.", "1 x 1 = 1.", "10 (=2) is 1+1, not 1x1.", "Multiplication is always allowed."]}, {"n": 43, "q": "Determine the binary arithmetic: 1+1", "o": ["0", "1", "10", "Not allowed"], "a": 2, "ex": ["0 is only the sum bit; you'd lose the carry.", "1 is wrong; 1+1 = 2.", "1 + 1 = 2, which is 10 in binary (sum 0, carry 1).", "Addition is always allowed."]}, {"n": 44, "q": "Determine the binary arithmetic: (1+1)-1", "o": ["0", "1", "10", "Not allowed"], "a": 1, "ex": ["10 - 1 = 1, not 0.", "(1+1) = 10, and 10 - 1 = 1.", "10 is the value before subtracting 1.", "Subtraction is allowed here."]}, {"n": 45, "q": "One of the data-link control protocol is described as: \"This flow control mechanism forces the sender after transmitting a data frame to stop and wait until the acknowledgement of the data-frame sent is received.\", determine the type of flow control that is described.", "o": ["Stop and wait ARQ", "Go-back N ARQ", "Selective Repeat ARQ", "Stop and release ARQ"], "a": 0, "ex": ["Send one frame, then stop and wait for its ACK: Stop-and-Wait ARQ.", "Go-Back-N sends a window of frames without waiting for each ACK.", "Selective Repeat also sends a window and resends only the frames that failed.", "'Stop and release ARQ' is not a real protocol."]}, {"n": 46, "q": "Which statement about ideal eye diagram is correct?", "o": ["The eye diagram's eye opening will be nearly circularly.", "The eye diagram is narrow and low.", "The eye diagram's eye opening will be nearly square.", "The eye diagram is narrow and high."], "a": 2, "src": "mine", "ex": ["A circular or rounded opening indicates bandwidth limits or ISI, not an ideal channel.", "Narrow and low means a closed eye: bad timing and noise margin.", "With no noise, jitter or ISI, the transitions are sharp, so the eye opening is wide, tall and nearly square.", "A narrow eye means little timing margin (jitter), so it is not ideal."]}, {"n": 47, "q": "What are some of the basic information that could be contained in an eye diagram?", "o": ["Time variation of zero crossing.", "Amount of variation between bits.", "Noise figure at sampling points.", "Amount of jitter in receivers."], "a": 0, "src": "mine", "ex": ["The spread of the zero crossings (timing variation) is a standard reading from an eye diagram.", "'Variation between bits' is not a standard eye-diagram measure.", "An eye diagram shows the noise margin, not the noise figure (an amplifier spec).", "The eye shows jitter in the received signal, not a property of the receivers themselves."]}, {"n": 48, "q": "Given the diagram of an input signal showing a sine wave with a period of 0.02 seconds, determine its frequency.", "o": ["50Hz", "75Hz", "100Hz", "25Hz"], "a": 0, "ex": ["f = 1/T = 1/0.02 s = 50 Hz.", "75Hz would need T = 0.0133 s.", "100Hz would need T = 0.01 s.", "25Hz would need T = 0.04 s."]}, {"n": 49, "q": "After the Initial permutation (IP) is done, the resulting permuted text is divided into ___________ blocks.", "o": ["2", "3", "4", "5"], "a": 0, "ex": ["The 64-bit permuted block is split into two 32-bit halves (LPT and RPT).", "DES splits into halves, not thirds.", "Not four; DES uses two 32-bit halves.", "Not five; DES uses two 32-bit halves."]}, {"n": 50, "q": "The following modulation scheme is described as: \"The phase of the modulated signal is shifted relative to the previous signal element. No reference signal is considered here. The signal phase follows the high or low state of the previous element.\", determine the type of modulator described.", "o": ["BPSK", "QPSK", "AM-SC", "DPSK"], "a": 3, "ex": ["BPSK uses absolute phases against a reference carrier.", "QPSK uses absolute phases for 2-bit symbols.", "AM-SC is amplitude modulation.", "Phase changes relative to the previous element, with no reference, is Differential PSK."]}, {"n": 51, "q": "Select the statement that best the purpose of MSME equalizer.", "o": ["It approximates the inverse of the channel with a linear filter.", "It designs the filter to minimize E[|e|^2], where e is the error signal that is the filter output minus the transmitted signal.", "It processes the incoming signal with a linear filter.", "It augments a linear equalizer by adding a filtered version of previous symbol estimates to the original filter output filter."], "a": 1, "src": "mine", "ex": ["Approximating the channel inverse is the zero-forcing equalizer.", "MMSE ('MSME' in the doc) means Minimum Mean Square Error: choose the filter that minimises E[|e|^2].", "This describes a generic linear equalizer.", "Feeding back past symbol decisions is a decision-feedback equalizer (DFE)."]}, {"n": 52, "q": "Select the statement that best the purpose of zero forcing equalizer.", "o": ["It approximates the inverse of the channel with a linear filter.", "It designs the filter to minimize E[|e|^2], where e is the error signal that is the filter output minus the transmitted signal.", "It processes the incoming signal with a linear filter.", "It augments a linear equalizer by adding a filtered version of previous symbol estimates to the original filter output filter."], "a": 0, "src": "mine", "ex": ["Zero-forcing inverts the channel response (forcing ISI to zero) with a linear filter.", "Minimising mean squared error is the MMSE equalizer.", "This describes a generic linear equalizer.", "Feeding back past symbol decisions is a decision-feedback equalizer (DFE)."]}, {"n": 53, "q": "Given the diagram of an input signal showing a square wave with a period of 1.0 ms, determine its frequency.", "o": ["1000Hz", "100Hz", "2Hz", "2000Hz"], "a": 0, "ex": ["f = 1/T = 1/0.001 s = 1000 Hz.", "100Hz would need T = 10 ms.", "2Hz would need T = 0.5 s.", "2000Hz would need T = 0.5 ms."]}, {"n": 54, "q": "What is the purpose of a source encoder?", "o": ["The source encoder compresses the data into minimum number of bits.", "The source encoder encrypts the signals into unintelligible output.", "The source encoder ensures the integrity of the signal.", "The source encoder decompresses the data into minimum number of bits."], "a": 0, "ex": ["Source coding removes redundancy to represent data in as few bits as possible.", "Encryption is a separate security step.", "Integrity and error protection are the channel encoder's job.", "Decompression happens at the receiver (source decoder), and it expands data rather than minimising it."]}, {"n": 55, "q": "Cyclic Redundancy Check is a technique that involves binary ___________ of the data bits being sent.", "o": ["Addition", "Subtraction", "Division", "Multiplication"], "a": 2, "ex": ["Checksums use addition; CRC doesn't.", "Subtraction is not the core CRC operation.", "CRC divides the data (modulo-2) by a generator polynomial; the remainder is the check value.", "Multiplication is not how the CRC is computed."]}, {"n": 56, "q": "What is one disadvantage of hamming code?", "o": ["Hamming code can only correct burst bit errors.", "Hamming code can only correct MSB bit errors.", "Hamming code can only correct LSB bit errors.", "Hamming code can only correct single bit errors."], "a": 3, "ex": ["Hamming code actually can't correct burst errors.", "It can correct an error at any bit position, not just the MSB.", "It can correct an error at any bit position, not just the LSB.", "Standard Hamming code corrects only one bit error per codeword."]}, {"n": 57, "q": "In hamming code, redundant bits are embedded ___________ the message.", "o": ["In front of", "End of", "Within", "First 2 bits of"], "a": 2, "ex": ["They aren't all placed in front; they're spread through the message.", "They aren't appended at the end; they sit at power-of-two positions.", "Parity bits are interleaved within the message at positions 1, 2, 4, 8, ...", "There are usually more than 2 parity bits, and they aren't grouped at the start."]}, {"n": 58, "src": "opts", "q": "Translate the following binary number 101010 into decimal.", "o": ["42", "21", "40", "52"], "a": 0, "ex": ["101010 = 32 + 8 + 2 = 42.", "21 is 10101; that's 101010 shifted right one place.", "40 is 101000.", "52 is 110100."]}, {"n": 59, "q": "Given an input signal of 20khz into a digital system, the sampling frequency is determined to be 10khz. Select the statement that best describe what will happen to the output signal.", "o": ["The output signal will be successfully reconstructed.", "The output signal cannot be successfully reconstructed due to aliasing error.", "The output signal will be successfully reconstructed but the output frequency will be altered.", "The output signal will be successfully reconstructed but the output amplitude will be altered."], "a": 1, "ex": ["It needs fs > 40kHz; 10kHz is far too low.", "fs = 10kHz < 2 x 20kHz = 40kHz, so aliasing prevents reconstruction.", "A changed frequency is aliasing, which means the signal was NOT reconstructed successfully.", "Undersampling causes aliasing, not just an amplitude change."]}, {"n": 60, "q": "When will aliasing error in a digital system?", "o": ["Aliasing error will occur when fs < 2fm", "Aliasing error will occur when fs > 2fm", "Aliasing error will occur when fs < fm", "Aliasing error will occur when fs > fm"], "a": 0, "ex": ["Sampling below the Nyquist rate (2fm) causes aliasing.", "fs > 2fm satisfies Nyquist, so there's no aliasing.", "fs < fm does alias, but aliasing already starts below 2fm; that is the general condition.", "fs > fm alone isn't enough; fs must exceed 2fm."]}, {"n": 61, "q": "DPSK encodes two distinct signals, i.e., the carrier and the modulating signal with ___________ phase shift each.", "o": ["90", "180", "270", "360"], "a": 1, "src": "mine", "ex": ["90-degree steps are used in QPSK.", "DPSK (binary) uses a 180-degree phase shift relative to the previous symbol.", "270 degrees is not used in binary DPSK.", "A 360-degree shift is no change at all."]}, {"n": 62, "q": "Data-link layer is responsible for implementation of point-to-point flow and ___________ mechanism.", "o": ["Data transfer", "Data connection", "Error control", "Error correction"], "a": 2, "src": "mine", "ex": ["Data transfer is a general function, not the paired mechanism.", "Data connection is not the standard term.", "The data-link layer provides flow control and error control (detection plus retransmission).", "Error correction is only one part of error control; the standard pairing is 'flow and error control'."]}, {"n": 63, "q": "There are 3 steps to encode a message using hamming code. Determine the missing step.\nCalculation of total numbers of redundant bits.\n??\nLastly, calculating the values of these redundant bits.", "o": ["Checking the MSB of the redundant bits.", "Calculating the position of the data bits.", "Checking the position of the redundant bits.", "Calculating the position of the redundant bits."], "a": 3, "src": "mine", "note": "Textbooks call step 2 'positioning the redundant bits'; c and d are close, so check against your notes.", "ex": ["The MSB isn't checked during encoding.", "The positions of the redundant bits are worked out first; the data bits fill whatever positions remain.", "Close, but nothing is 'checked' here; the positions are worked out (calculated) as powers of 2.", "Step 2 is working out where the redundant bits go (positions 1, 2, 4, 8, ...)."]}, {"n": 64, "q": "What is the purpose of an Analogue to digital converter?", "o": ["An ADC encodes an analogue signal into a binary code.", "An ADC images an analogue signal into a binary code.", "An ADC decrypts binary code.", "An ADC encodes an analogue signal into an analogue code."], "a": 0, "ex": ["An ADC samples, quantises and encodes an analogue signal as binary.", "'Images' is not what an ADC does.", "Decryption is a security function, not conversion.", "The output of an ADC is digital, not analogue."]}, {"n": 65, "q": "A 16-bit ADC will have a resolution of ___________?", "o": ["65530", "65536", "65540", "65545"], "a": 1, "ex": ["Not a power of two.", "2^16 = 65536 levels.", "Not a power of two.", "Not a power of two."]}, {"n": 66, "q": "One of the error correction technique is described as \"When the receiver detects an error in the data received, it requests back the sender to retransmit the data unit.\", determine the method used.", "o": ["Forward error correction", "Backward error correction", "Auto repeat request", "Cyclic Redundancy technique"], "a": 2, "ex": ["FEC fixes errors at the receiver without retransmission.", "Not the doc's answer; requesting retransmission is ARQ (Automatic Repeat reQuest).", "Asking the sender to resend is Automatic Repeat reQuest (ARQ).", "CRC only detects errors; it doesn't request retransmission."]}, {"n": 67, "q": "One of the error correction technique is described as \"When the receiver detects some error in the data received, it executes error-correcting code, which helps it to auto-recover and to correct some kinds of errors.\", determine the method used.", "o": ["Forward error correction", "Backward error correction", "Auto repeat request", "Cyclic Redundancy technique"], "a": 0, "ex": ["The receiver corrects errors itself using redundant code: Forward Error Correction.", "Backward correction relies on retransmission.", "ARQ asks the sender to resend rather than self-correcting.", "CRC detects errors but cannot correct them."]}, {"n": 68, "q": "Huffman Coding is generally useful to compress the data in which there are ___________ characters.", "o": ["Frequently occurring", "Uniquely occurring", "Evenly occurring", "Non occurring"], "a": 0, "src": "mine", "ex": ["Huffman gives short codes to frequent characters, so it helps when some characters occur often.", "If every character is unique there's no frequency skew to exploit.", "With evenly distributed characters, Huffman gives little or no gain.", "Characters that never occur aren't encoded at all."]}, {"n": 69, "q": "Which statement about Huffman coding is true?", "o": ["Huffman coding is a type of channel coding technique.", "Huffman coding is a type of modulation technique.", "Huffman coding is a type of source coding technique.", "Huffman coding is a type of analogue to digital converter technique."], "a": 2, "src": "mine", "ex": ["Channel coding adds redundancy for error control; Huffman removes redundancy.", "Modulation maps bits onto a carrier; Huffman doesn't.", "Huffman is lossless source coding (compression).", "A/D conversion is sampling and quantisation, not Huffman coding."]}];
const L='ABCD';
const TAGS={mine:'Answer not given in doc, supplied',opts:'Options supplied (answer from doc)',check:'Reworded / missing info in doc, double-check'};
let deck=[],pos=0,rc=0,ra=0,tc=0,ta=0,round=1,lastId=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newDeck(){deck=shuffle(QS.map((_,i)=>i));if(deck.length>1&&deck[0]===lastId){[deck[0],deck[1]]=[deck[1],deck[0]]}pos=0;rc=0;ra=0}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hud(){$('prog').textContent=`Round ${round} · ${Math.min(pos+1,deck.length)} / ${deck.length}`;$('score').textContent=`Round ${rc}/${ra} · Total ${tc}/${ta}`;$('barfill').style.width=(pos/deck.length*100)+'%'}
function show(){
  if(pos>=deck.length){roundDone();return}
  locked=false;const q=QS[deck[pos]];lastId=deck[pos];hud();
  $('card').innerHTML=(TAGS[q.src]?`<span class="tag">${TAGS[q.src]}</span>`:'')+
   `<p class="q">${esc(q.q)}</p><div class="opts">`+q.o.map((t,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b><span>${esc(t)}</span></button>`).join('')+
   `</div><div class="flash" id="flash"></div><div id="after"></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  window.scrollTo(0,0);
}
function answer(i){
  if(locked)return;locked=true;const q=QS[deck[pos]];const btns=document.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);ra++;ta++;btns[q.a].classList.add('ok');
  if(i===q.a){rc++;tc++;hud();$('flash').textContent='Correct!';setTimeout(()=>{pos++;show()},900)}
  else{btns[i].classList.add('bad');hud();
    $('after').innerHTML=`<div class="exp"><p><span class="h g">Correct: ${L[q.a]}.</span> ${esc(q.ex[q.a])}</p><p><span class="h r">Your answer, ${L[i]}:</span> ${esc(q.ex[i])}</p>${q.note?`<p><i>Note: ${esc(q.note)}</i></p>`:''}</div><button class="next" id="nx">Next</button>`;
    $('nx').onclick=()=>{pos++;show()};}
}
function roundDone(){
  $('barfill').style.width='100%';
  $('card').innerHTML=`<div class="round"><h2>Round ${round} complete</h2><p>You scored ${rc} / ${ra} (${Math.round(rc/ra*100)}%)</p><button class="next" id="nr">Start round ${round+1}</button></div>`;
  $('nr').onclick=()=>{round++;newDeck();show()};
}
newDeck();show();
window.__quiz={QS,get deck(){return deck},get pos(){return pos},answer,next:()=>{pos++;show()}};
</script></body></html>
